name: EXP76 A-B timer pressure diagnostics (NO FLASH)
on:
  push:
    branches: [exp76-rt-pa-lock-fix]
    paths:
      - '.github/workflows/exp76-rt-timer-pressure-diagnostic.yml'
permissions:
  contents: read
  actions: read
jobs:
  path-a-gdb-hrtimer:
    name: A - V3 hrtimer callback probe
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp76-rt-pa-lock-fix
      - name: Download frozen Image and vmlinux
        uses: actions/download-artifact@v4
        with:
          name: exp76-r30-spinlock-v3-qemu-NOFLASH
          run-id: 43262844850
          repository: nywuer777/Pipa-Experimental-Kernel
          github-token: ${{ github.token }}
          path: input
      - name: Download exact R59 V3 initramfs
        uses: actions/download-artifact@v4
        with:
          name: exp76-r58-direct-insmod-NOFLASH
          run-id: 43485810277
          repository: nywuer777/Pipa-Experimental-Kernel
          github-token: ${{ github.token }}
          path: v3
      - name: Probe hrtimer callback under V3
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p reports
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm gdb-multiarch
          image=input/r23b/output/arch/arm64/boot/Image
          vmlinux=input/r23b/output/vmlinux
          initrd=v3/reports/direct-initramfs.cpio.gz
          cat > reports/inputs.sha256 <<'HASHES'
          0b9b6d787bdefb667b13579e4d819bac893af7babc49dab00ce1c7d2d8ca9e5a  input/r23b/output/arch/arm64/boot/Image
          47e887b66a362e0fcd27cff5ccda630d74fb994063a99d28db8c295fcfbf45b5  input/r23b/output/vmlinux
          c7248a227ae4d0624769644ed066b56eee3ef9b1fd9cdf29116994c4936d68bd  v3/reports/direct-initramfs.cpio.gz
          HASHES
          sha256sum -c reports/inputs.sha256
          grep -E '^(# CONFIG_FTRACE is not set|# CONFIG_DEBUG_FS is not set)' input/r23b/reports/effective.config > reports/tracing-config.txt
          echo 'A_INSTRUMENTATION=GDB call-site probe; ftrace unavailable in frozen Image' > reports/instrumentation.txt
          cat > reports/probe.gdb <<'GDB'
          set pagination off
          set confirm off
          target remote 127.0.0.1:12379
          break hrtimer_start_range_ns
          condition 1 *(unsigned long *)($x0 + 40) == 0
          commands 1
          silent
          printf "ARM_NULL_CALLBACK timer=%p function=%p\\n", $x0, *(unsigned long *)($x0 + 40)
          bt 16
          continue
          end
          break *0xffffff80100faefc
          commands 2
          silent
          printf "HR_CALL timer=%p callback_x19=%p callback_field=%p\\n", $x0, $x19, *(unsigned long *)($x0 + 40)
          if $x19 == 0
          printf "NULL_CALLBACK_CALL timer=%p\\n", $x0
          x/8gx $x0
          bt 24
          info registers x0 x19 pc sp x29 x30
          end
          continue
          end
          continue
          GDB
          timeout -k 5s 40s qemu-system-aarch64 -M virt -cpu cortex-a72 -smp 4 -m 512 -nodefaults -serial stdio -monitor none -display none -nic none -no-reboot -gdb tcp:127.0.0.1:12379 -S -kernel "$image" -initrd "$initrd" -append 'earlycon=pl011,0x09000000 console=ttyAMA0,115200 loglevel=8 ignore_loglevel printk.time=1 nokaslr panic=5 init=/init' > reports/console.txt 2>&1 &
          qemu_pid=$!
          sleep 1
          set +e
          timeout -k 5s 35s gdb-multiarch -q -batch "$vmlinux" -x reports/probe.gdb > reports/trace.txt 2>&1
          gdb_rc=$?
          wait "$qemu_pid"
          qemu_rc=$?
          set -e
          echo "GDB_EXIT=$gdb_rc QEMU_EXIT=$qemu_rc" > reports/run-status.txt
          echo "QEMU_EXIT=$qemu_rc" >> reports/console.txt
          grep -c 'ARM_NULL_CALLBACK' reports/trace.txt > reports/arm-null-count.txt || echo 0 > reports/arm-null-count.txt
          grep -c 'NULL_CALLBACK_CALL' reports/trace.txt > reports/null-call-count.txt || echo 0 > reports/null-call-count.txt
          sha256sum reports/console.txt > reports/console.sha256
          sha256sum reports/trace.txt > reports/trace.sha256
          cat reports/run-status.txt
          grep -E 'ARM_NULL_CALLBACK|HR_CALL|NULL_CALLBACK_CALL|Breakpoint|Remote connection|Program received signal' reports/trace.txt | tail -100 || true
          cat reports/console.txt
      - name: Archive Path A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp76-path-a-hrtimer-gdb
          path: reports/
          retention-days: 30
          if-no-files-found: warn

  path-b-no-module-stress:
    name: B - idle kernel under userspace timer load
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp76-rt-pa-lock-fix
      - name: Download frozen Image and BusyBox source
        uses: actions/download-artifact@v4
        with:
          name: exp76-r30-spinlock-v3-qemu-NOFLASH
          run-id: 43262844850
          repository: nywuer777/Pipa-Experimental-Kernel
          github-token: ${{ github.token }}
          path: input
      - name: Build module-free stress initramfs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports root/{bin,dev,proc,sys}
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm cpio
          image=input/r23b/output/arch/arm64/boot/Image
          source_initrd=input/r30/reports/v3/v3-initramfs.cpio.gz
          cat > reports/inputs.sha256 <<'HASHES'
          0b9b6d787bdefb667b13579e4d819bac893af7babc49dab00ce1c7d2d8ca9e5a  input/r23b/output/arch/arm64/boot/Image
          6939bae31dc9a14b585020ef89654add4cba809c7104c02baaedd4261405be30  input/r30/reports/v3/v3-initramfs.cpio.gz
          HASHES
          sha256sum -c reports/inputs.sha256
          gzip -dc "$source_initrd" | (cd root && cpio -id --quiet --no-absolute-filenames --no-preserve-owner 'bin/busybox')
          test -x root/bin/busybox
          for app in sh mount dmesg tail poweroff sleep; do
            ln -sf busybox "root/bin/$app"
          done
          sudo mknod -m 600 root/dev/console c 5 1
          sudo mknod -m 666 root/dev/null c 1 3
          if find root -type f -name '*.ko' | grep -q .; then
            echo 'ERROR=module-present-in-stress-initramfs' > reports/module-gate.txt
            exit 1
          fi
          echo 'B_MODULE_GATE=PASS; 4 userspace shell loops, sleep interval 10ms' > reports/stress-mode.txt
          cat > root/init <<'INIT'
          #!/bin/sh
          export PATH=/bin
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          mount -t devtmpfs devtmpfs /dev
          echo 'EXP76_STRESS_BEGIN'
          for i in 1 2 3 4; do
            (while true; do sleep 0.01; done) >/dev/null 2>&1 &
          done
          sleep 8
          echo 'EXP76_STRESS_8S_OK'
          dmesg | tail -60
          echo 'EXP76_STRESS_END'
          for worker in $(jobs -p); do kill "$worker" 2>/dev/null || true; done
          poweroff -f
          INIT
          chmod 755 root/init
          (cd root && find . -print0 | cpio --null -o --format=newc --quiet) | gzip -n > reports/stress-initramfs.cpio.gz
          sha256sum reports/stress-initramfs.cpio.gz > reports/initramfs.sha256
          test -z "$(find root -type f -name '*.ko' -print -quit)"
      - name: Run module-free stress QEMU
        shell: bash
        timeout-minutes: 2
        run: |
          set -uo pipefail
          timeout -k 5s 30s qemu-system-aarch64 -M virt -cpu cortex-a72 -smp 4 -m 512 -nodefaults -serial stdio -monitor none -display none -nic none -no-reboot -kernel input/r23b/output/arch/arm64/boot/Image -initrd reports/stress-initramfs.cpio.gz -append 'earlycon=pl011,0x09000000 console=ttyAMA0,115200 loglevel=8 ignore_loglevel printk.time=1 nokaslr panic=5 init=/init' > reports/console.txt 2>&1
          rc=$?
          echo "QEMU_EXIT=$rc" >> reports/console.txt
          echo "$rc" > reports/qemu-exit.txt
          sha256sum reports/console.txt > reports/console.sha256
          cat reports/console.txt
      - name: Archive Path B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp76-path-b-no-module-stress
          path: reports/
          retention-days: 30
          if-no-files-found: warn
