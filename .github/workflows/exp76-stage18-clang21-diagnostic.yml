          lines += ['', 'KERNEL_BUILT=false; FLASH_READY=false']
          output = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with output.open('a', encoding='utf-8') as stream:
              stream.write('\n'.join(lines) + '\n')
          PY

