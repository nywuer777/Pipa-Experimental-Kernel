              stage74 = json.loads(stage74_path.read_text(encoding='utf-8'))
              lines += ['', '### Stage74 radix-tree RT local-lock include (NONFLASH)', '']
              lines += [
                  f"Patch applied: {stage74.get('applied')}",
                  f"RT lock calls preserved: {stage74.get('rt_lock_calls_preserved')}",
                  f"RT locallock API verified: {stage74.get('existing_locallock_api_verified')}",
                  f"Remaining RT rejects: {stage74.get('remaining_rejected_files')}",
              ]
          crypto_path = Path('exp76-stage75-report/CRYPTO_SUBTREE_DIAGNOSTIC.json')
          if crypto_path.is_file():
              crypto = json.loads(crypto_path.read_text(encoding='utf-8'))
              lines += ['', '### Stage75 crypto subtree Kbuild (NONFLASH)', '']
              lines += [
                  f"Target: {crypto.get('target')}",
                  f"Directory scope: {crypto.get('top_level_directory_scope')}",
                  f"LIB gate passed: {crypto.get('prior_lib_subtree_gate')}",
                  f"Archive created: {crypto.get('archive_created')}",
                  f"llvm-ar inspection exit: {crypto.get('archive_inspection_exit_code')}",
                  f"Archive members verified: {crypto.get('archive_has_members')}",
                  f"Archive member count: {crypto.get('archive_members_count')}",
                  f"Exit code: {crypto.get('exit_code')}",
                  f"Timed out: {crypto.get('timed_out')}",
              ]
              crypto_errors = (crypto.get('errors_excerpt') or [])[:8]
              if crypto_errors:
                  lines += ['', 'First CRYPTO Kbuild errors:', '']
                  lines += ['    ' + str(err)[:320] for err in crypto_errors]
          drivers_path = Path('exp76-stage76-report/DRIVERS_SUBTREE_DIAGNOSTIC.json')
          if drivers_path.is_file():
              drivers = json.loads(drivers_path.read_text(encoding='utf-8'))
              lines += ['', '### Stage76 driver subtree Kbuild (NONFLASH)', '']
              lines += [
                  f"Target: {drivers.get('target')}",
                  f"Directory scope: {drivers.get('top_level_directory_scope')}",
                  f"CRYPTO gate passed: {drivers.get('prior_crypto_subtree_gate')}",
                  f"Archive created: {drivers.get('archive_created')}",
                  f"llvm-ar inspection exit: {drivers.get('archive_inspection_exit_code')}",
                  f"Archive members verified: {drivers.get('archive_has_members')}",
                  f"Archive member count: {drivers.get('archive_members_count')}",
                  f"Exit code: {drivers.get('exit_code')}",
                  f"Timed out: {drivers.get('timed_out')}",
              ]
              driver_errors = (drivers.get('errors_excerpt') or [])[:8]
              if driver_errors:
                  lines += ['', 'First DRIVERS Kbuild errors:', '']
                  lines += ['    ' + str(err)[:320] for err in driver_errors]
          stage77_path = Path('exp76-stage77-report/COMPILE_H_PREP_DIAGNOSTIC.json')
          if stage77_path.is_file():
              stage77 = json.loads(stage77_path.read_text(encoding='utf-8'))
              lines += ['', '### Stage77 Kbuild generated compile.h (NONFLASH)', '']
              lines += [
                  f"Target: {stage77.get('target')}",
                  f"Generated header: {stage77.get('generated_header')}",
                  f"Header created: {stage77.get('compile_h_created')}",
                  f"Header has required UTS/compiler macros: {stage77.get('compile_h_anchors_valid')}",
                  f"init/version.o created: {stage77.get('init_version_object_created')}",
                  f"Exit code: {stage77.get('exit_code')}",
                  f"Timed out: {stage77.get('timed_out')}",
              ]
              stage77_errors = (stage77.get('errors_excerpt') or [])[:8]
              if stage77_errors:
                  lines += ['', 'First compile.h Kbuild errors:', '']
                  lines += ['    ' + str(err)[:320] for err in stage77_errors]
          lines += ['', 'KERNEL_BUILT=false; FLASH_READY=false']
          output = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with output.open('a', encoding='utf-8') as stream:
              stream.write('\n'.join(lines) + '\n')
          PY

