              ]
          stage91_path = Path('exp76-rt-report/stage91/stage91-status.json')
          if stage91_path.is_file():
              pid_atomic = json.loads(stage91_path.read_text(encoding='utf-8'))
              lines += ['', '### Stage91 direct PID atomic dependency (NONFLASH)', '']
              lines += [
