          bash -n tools/exp76-rt-compat-audit.sh
          ! grep -E 'make[[:space:]].*(Image|vmlinux|boot.img)' tools/exp76-stage18-clang21-object-diagnostic.sh
          echo 'EXP76_STAGE18_NO_FLASH_CODE_GATE=PASS'

      - name: Install pinned kernel build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git make bc bison flex libssl-dev libelf-dev libncurses-dev \
            python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            rsync device-tree-compiler
          df -h .

      - name: Obtain exact Android Clang 21 from EXP75
        shell: bash
        run: |
          set -euo pipefail
          mkdir android-clang-prebuilt
          cd android-clang-prebuilt
          git init
          git remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git config core.sparseCheckout true
          printf '/clang-r563880c/\n' > .git/info/sparse-checkout
          git config http.version HTTP/1.1
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 120
          for attempt in 1 2 3; do
            if git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$ANDROID_LLVM_COMMIT" && git checkout --detach FETCH_HEAD; then
              break
            fi
            test "$attempt" -lt 3
            sleep 15
          done
          test "$(git rev-parse HEAD)" = "$ANDROID_LLVM_COMMIT"
          test -x clang-r563880c/bin/clang
          test -x clang-r563880c/bin/ld.lld
          clang-r563880c/bin/clang --version
          clang-r563880c/bin/clang --version | grep -F 'clang version 21.0.0'
          clang-r563880c/bin/clang --version | grep -F 'Android (14054515,'
          rm -rf .git

      - name: Prepare Stage48 hunk-scoped RCU rejects and RT workqueue
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          bash tools/exp76-rt-compat-audit.sh > stage18-prior-audit.log 2>&1 || {
            tail -n 100 stage18-prior-audit.log
            exit 1
          }
          test -f exp76-rt-report/stage19/stage19-status.json
          test -f exp76-rt-report/stage20/stage20-status.json
          test -f exp76-rt-report/stage21/stage21-status.json
          test -f exp76-rt-report/stage26/stage26-status.json
          test -f exp76-rt-report/stage27/stage27-status.json
          test -f exp76-rt-report/stage28/stage28-status.json
          test -f exp76-rt-report/stage29/stage29-status.json
          test -f exp76-rt-report/stage31/stage31-status.json
          test -f exp76-rt-report/stage34/stage34-status.json
          test -f exp76-rt-report/stage35/stage35-status.json
          test -f exp76-rt-report/stage36/stage36-status.json
          test -f exp76-rt-report/stage38/stage38-status.json
          test -f exp76-rt-report/stage40/stage40-status.json
          test -f exp76-rt-report/stage41/stage41-status.json
          test -f exp76-rt-report/stage42/stage42-status.json
          test -f exp76-rt-report/stage47/stage47-status.json
          test -f exp76-rt-report/stage51/stage51-status.json
          test -f exp76-rt-report/stage52/stage52-status.json
          test -f exp76-rt-report/stage53/stage53-status.json
          test -f exp76-rt-report/stage54/stage54-status.json
          test -f exp76-rt-report/stage55/stage55-status.json
          test -f exp76-rt-report/stage56/stage56-status.json
          test -f exp76-rt-report/stage57/stage57-status.json
          test -f exp76-rt-report/stage58/stage58-status.json
          test -f exp76-rt-report/stage59/stage59-status.json
          test -f exp76-rt-report/stage60/stage60-status.json
          test -f exp76-rt-report/stage61/stage61-status.json
          test -f exp76-rt-report/stage62/stage62-status.json
          test -f exp76-rt-report/stage63/stage63-status.json
          test -f exp76-rt-report/stage64/stage64-status.json
          test "$(find exp76-trial-overlay -name '*.rej' -type f | wc -l)" -eq 64
          test -f exp76-trial-overlay/kernel/sched/cpupri.c.rej
          echo 'EXP76_STAGE18_SOURCE=PINNED_STAGE48_RCU_HUNK_SCOPED'

      - name: Inventory 64 unresolved PREEMPT_RT hunk rejects (READONLY NONFLASH)
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 tools/exp76-stage82-rt-reject-inventory.py \
            --tree exp76-trial-overlay \
            --manifest exp76-rt-report/overlay/rejected-paths.txt \
            --report exp76-stage82-report
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(
              Path('exp76-stage82-report/RT_REJECT_HUNK_INVENTORY.json').read_text()
          )
          assert data['remaining_rejected_files'] == 64
          assert data['total_rejected_hunks'] > 0
          assert data['remaining_not_in_initial_manifest'] == []
          assert data['resolution_verified'] is False
          assert data['source_modified'] is False
          assert data['rejects_deleted'] is False
          assert data['full_kernel_link_performed'] is False
          assert not data['kernel_built'] and not data['flash_ready']
          print(
              'EXP76_STAGE82_RT_REJECT_INDEX=64_FILES;' +
              f"HUNKS={data['total_rejected_hunks']};" +
              'FLASH_READY=false'
          )
          PY

      - name: Verify KASAN quarantine vendor-equivalent RT spinlock hunks (READONLY)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/exp76-stage87-kasan-vendor-equivalence.py \
            --tree exp76-trial-overlay \
            --inventory exp76-stage82-report/RT_REJECT_HUNK_INVENTORY.json \
            --report exp76-rt-report/stage87
          python3 - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('exp76-rt-report/stage87/stage87-status.json').read_text())
          assert status['vendor_equivalent_hunks'] == 6
          assert status['vendor_equivalent_files'] == 1
          assert status['reviewed_added_lines'] == 9
          assert status['reviewed_removed_lines'] == 9
          assert status['all_added_raw_spinlock_lines_present']
          assert status['all_obsolete_spinlock_lines_absent']
          assert not status['source_changed'] and not status['rejects_deleted']
          assert status['rejected_files_remaining'] == 64
          assert not status['all_rt_semantics_verified']
          assert not status['kernel_built'] and not status['flash_ready']
          print('EXP76_STAGE87_KASAN_VENDOR_EQUIVALENT=6_HUNKS; REJECTS_RETAINED=64')
          PY

      - name: Port verified ARM64 ChaCha20 and Poly1305 NEON RT Kconfig hunk (NONFLASH)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/exp76-rt-stage83-arm64-neon-crypto.py \
            --tree exp76-trial-overlay \
            --index exp76-stage82-report/RT_REJECT_HUNK_INVENTORY.json \
            --report exp76-rt-report/stage83 \
            --mode apply
          python3 - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('exp76-rt-report/stage83/stage83-status.json').read_text())
          assert s['applied'] is True
          assert s['rejected_hunks_reviewed'] == 1
          assert s['config_dependencies_patched'] == [
              'CRYPTO_CHACHA20_NEON', 'CRYPTO_POLY1305_NEON'
          ]
          assert s['nonrt_kernel_mode_neon_preserved'] is True
          assert s['reject_audit_file_retained'] is True
          assert s['semantic_backport_review_pending'] is True
          assert s['remaining_rejected_files'] == 64
          assert not s['full_kernel_link_performed'] and not s['flash_ready']
          print('EXP76_STAGE83_ARM64_NEON_RT_GUARDS=APPLIED; REJECTS_RETAINED=64')
