permissions:
  contents: read

concurrency:
  group: exp76-stage18-clang21-diagnostic
  cancel-in-progress: false

jobs:
  clang21-object-diagnostic:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      ANDROID_LLVM_COMMIT: b54cd2c8e9e0bb057aef3804d42d39c5ac4674c7
    steps:
      - uses: actions/checkout@v4

      - name: Validate object-only diagnostic scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/exp76-stage18-clang21-object-diagnostic.sh
          python3 tests/test_exp76_stage22_prepare_parser.py
          python3 -m py_compile tools/exp76-stage23-prepare-gate.py
          python3 tests/test_exp76_stage23_prepare_gate.py
          python3 -m py_compile tools/exp76-stage24-collect-ci-evidence.py
          python3 tests/test_exp76_stage24_evidence.py
          python3 -m py_compile tools/exp76-rt-stage26-fork-affinity.py
          python3 tests/test_exp76_stage26_fork_affinity.py
          python3 -m py_compile tools/exp76-rt-stage27-core-affinity.py
          python3 tests/test_exp76_stage27_core_affinity.py
          python3 -m py_compile tools/exp76-rt-stage28-task-state.py
          python3 tests/test_exp76_stage28_task_state.py
          python3 -m py_compile tools/exp76-rt-stage29-migration-abi.py
          python3 tests/test_exp76_stage29_migration_abi.py
          python3 -m py_compile tools/exp76-stage30-object-coverage.py
          python3 tests/test_exp76_stage30_object_coverage.py
          python3 -m py_compile tools/exp76-rt-stage31-class-affinity.py
          python3 tests/test_exp76_stage31_class_affinity.py
          python3 -m py_compile tools/exp76-rt-stage34-timer-swork.py
          python3 tests/test_exp76_stage34_timer_swork.py
          python3 -m py_compile tools/exp76-rt-stage35-might-sleep.py
          python3 tests/test_exp76_stage35_might_sleep.py
          python3 -m py_compile tools/exp76-stage36-migration-contract.py
          python3 tests/test_exp76_stage36_migration_contract.py
          python3 -m py_compile tools/exp76-rt-stage38-softirq-entry.py
          python3 tests/test_exp76_stage38_softirq_entry.py
          python3 -m py_compile tools/exp76-rt-stage40-sleeping-lock.py
          python3 tests/test_exp76_stage40_sleeping_lock.py
          python3 -m py_compile tools/exp76-rt-stage41-migration-lifecycle.py
          python3 tests/test_exp76_stage41_migration_lifecycle.py
          python3 -m py_compile tools/exp76-rt-stage42-hotplug-tlb.py
          python3 tests/test_exp76_stage42_hotplug_tlb.py
          python3 -m py_compile tools/exp76-stage46-cross-subsystem-coverage.py
          python3 tests/test_exp76_stage46_cross_subsystem.py
          python3 -m py_compile tools/exp76-stage50-kernel-subtree.py
          python3 tests/test_exp76_stage50_kernel_subtree.py
          echo 'EXP76_STAGE49_RT_LOCKING_KBUILD_TARGETS=10; LINK=false'
          python3 -m py_compile tools/exp76-rt-stage47-rcu-workqueue.py
          python3 tests/test_exp76_stage47_rcu_workqueue.py
          python3 -m py_compile tools/exp76-rt-stage51-neigh-const.py
          python3 tests/test_exp76_stage51_neigh_const.py
          python3 -m py_compile tools/exp76-rt-stage52-cgroup-cpuset.py
          python3 tests/test_exp76_stage52_cgroup_cpuset.py
          python3 -m py_compile tools/exp76-rt-stage53-lru-cpudl.py
          python3 tests/test_exp76_stage53_lru_cpudl.py
          python3 -m py_compile tools/exp76-rt-stage54-posix-timers.py
          python3 tests/test_exp76_stage54_posix_timers.py
          python3 -m py_compile tools/exp76-rt-stage55-irq-rwsem.py
          python3 tests/test_exp76_stage55_irq_rwsem.py
          python3 -m py_compile tools/exp76-rt-stage56-slub-posix.py
          python3 tests/test_exp76_stage56_slub_posix.py
          python3 -m py_compile tools/exp76-rt-stage57-rwlock-nohz.py
          python3 tests/test_exp76_stage57_rwlock_nohz.py
          python3 -m py_compile tools/exp76-rt-stage58-rwlock-outofline.py
          python3 tests/test_exp76_stage58_rwlock_outofline.py
          python3 -m py_compile tools/exp76-rt-stage59-kthread-proc.py
          python3 tests/test_exp76_stage59_kthread_proc.py
          python3 -m py_compile tools/exp76-rt-stage60-futex.py
          python3 tests/test_exp76_stage60_futex.py
          python3 -m py_compile tools/exp76-rt-stage61-smp-uffd.py
          python3 tests/test_exp76_stage61_smp_uffd.py
          python3 -m py_compile tools/exp76-rt-stage62-phandle-cache.py
          python3 tests/test_exp76_stage62_phandle_cache.py
          python3 -m py_compile tools/exp76-rt-stage63-nandswap-spinlock.py
          python3 tests/test_exp76_stage63_nandswap_spinlock.py
          python3 -m py_compile tools/exp76-rt-stage64-ion-spinlock.py
          python3 tests/test_exp76_stage64_ion_spinlock.py
          python3 -m py_compile tools/exp76-stage66-mm-subtree.py
          python3 tests/test_exp76_stage66_mm_subtree.py
          python3 -m py_compile tools/exp76-stage67-fs-subtree.py
          python3 tests/test_exp76_stage67_fs_subtree.py
          python3 -m py_compile tools/exp76-stage68-ipc-subtree.py
          python3 tests/test_exp76_stage68_ipc_subtree.py
          python3 -m py_compile tools/exp76-stage69-security-subtree.py
          python3 tests/test_exp76_stage69_security_subtree.py
          python3 -m py_compile tools/exp76-stage72-net-subtree.py
          python3 tests/test_exp76_stage72_net_subtree.py
          python3 -m py_compile tools/exp76-stage73-lib-subtree.py
          python3 tests/test_exp76_stage73_lib_subtree.py
          python3 -m py_compile tools/exp76-rt-stage74-radix-locallock.py
          python3 tests/test_exp76_stage74_radix_locallock.py
          python3 -m py_compile tools/exp76-stage75-crypto-subtree.py
          python3 tests/test_exp76_stage75_crypto_subtree.py
          python3 -m py_compile tools/exp76-stage76-drivers-subtree.py
          python3 tests/test_exp76_stage76_drivers_subtree.py
          python3 -m py_compile tools/exp76-stage77-compile-h-preflight.py
          python3 tests/test_exp76_stage77_compile_h_preflight.py
          ! grep -E 'make[[:space:]].*(Image|vmlinux|boot.img)' tools/exp76-stage30-object-coverage.py
          bash -n tools/exp76-rt-compat-audit.sh
          ! grep -E 'make[[:space:]].*(Image|vmlinux|boot.img)' tools/exp76-stage18-clang21-object-diagnostic.sh
          echo 'EXP76_STAGE18_NO_FLASH_CODE_GATE=PASS'

      - name: Install pinned kernel build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git make bc bison flex libssl-dev libelf-dev libncurses-dev \
            python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            rsync device-tree-compiler
          df -h .

      - name: Obtain exact Android Clang 21 from EXP75
        shell: bash
        run: |
          set -euo pipefail
          mkdir android-clang-prebuilt
          cd android-clang-prebuilt
          git init
          git remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git config core.sparseCheckout true
          printf '/clang-r563880c/\n' > .git/info/sparse-checkout
          git config http.version HTTP/1.1
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 120
          for attempt in 1 2 3; do
            if git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$ANDROID_LLVM_COMMIT" && git checkout --detach FETCH_HEAD; then
              break
            fi
            test "$attempt" -lt 3
            sleep 15
          done
          test "$(git rev-parse HEAD)" = "$ANDROID_LLVM_COMMIT"
          test -x clang-r563880c/bin/clang
          test -x clang-r563880c/bin/ld.lld
          clang-r563880c/bin/clang --version
          clang-r563880c/bin/clang --version | grep -F 'clang version 21.0.0'
          clang-r563880c/bin/clang --version | grep -F 'Android (14054515,'
          rm -rf .git

      - name: Prepare Stage48 hunk-scoped RCU rejects and RT workqueue
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          bash tools/exp76-rt-compat-audit.sh > stage18-prior-audit.log 2>&1 || {
            tail -n 100 stage18-prior-audit.log
            exit 1
          }
          test -f exp76-rt-report/stage19/stage19-status.json
          test -f exp76-rt-report/stage20/stage20-status.json
          test -f exp76-rt-report/stage21/stage21-status.json
          test -f exp76-rt-report/stage26/stage26-status.json
          test -f exp76-rt-report/stage27/stage27-status.json
          test -f exp76-rt-report/stage28/stage28-status.json
          test -f exp76-rt-report/stage29/stage29-status.json
          test -f exp76-rt-report/stage31/stage31-status.json
          test -f exp76-rt-report/stage34/stage34-status.json
          test -f exp76-rt-report/stage35/stage35-status.json
          test -f exp76-rt-report/stage36/stage36-status.json
          test -f exp76-rt-report/stage38/stage38-status.json
          test -f exp76-rt-report/stage40/stage40-status.json
          test -f exp76-rt-report/stage41/stage41-status.json
          test -f exp76-rt-report/stage42/stage42-status.json
          test -f exp76-rt-report/stage47/stage47-status.json
          test -f exp76-rt-report/stage51/stage51-status.json
          test -f exp76-rt-report/stage52/stage52-status.json
          test -f exp76-rt-report/stage53/stage53-status.json
          test -f exp76-rt-report/stage54/stage54-status.json
          test -f exp76-rt-report/stage55/stage55-status.json
          test -f exp76-rt-report/stage56/stage56-status.json
          test -f exp76-rt-report/stage57/stage57-status.json
          test -f exp76-rt-report/stage58/stage58-status.json
          test -f exp76-rt-report/stage59/stage59-status.json
          test -f exp76-rt-report/stage60/stage60-status.json
          test -f exp76-rt-report/stage61/stage61-status.json
          test -f exp76-rt-report/stage62/stage62-status.json
          test -f exp76-rt-report/stage63/stage63-status.json
          test -f exp76-rt-report/stage64/stage64-status.json
          test "$(find exp76-trial-overlay -name '*.rej' -type f | wc -l)" -eq 64
          test -f exp76-trial-overlay/kernel/sched/cpupri.c.rej
          echo 'EXP76_STAGE18_SOURCE=PINNED_STAGE48_RCU_HUNK_SCOPED'

      - name: Patch radix-tree RT local-lock header after source audits (NONFLASH)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/exp76-rt-stage74-radix-locallock.py \
            --tree exp76-trial-overlay \
            --report exp76-rt-report/stage74 \
            --mode apply
          test -f exp76-rt-report/stage74/stage74-status.json
          test "$(find exp76-trial-overlay -name '*.rej' -type f | wc -l)" -eq 64

      - name: Run arm64 prepare gate, then compile only selected scheduler objects
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          bash tools/exp76-stage18-clang21-object-diagnostic.sh

      - name: Compile additional RT scheduler, locking and hotplug objects (NONFLASH)
        shell: bash
        timeout-minutes: 27
        run: |
          set -euo pipefail
          python3 tools/exp76-stage30-object-coverage.py \
            --kernel exp76-trial-overlay \
            --output exp76-stage18-out \
            --report exp76-stage30-report \
            --baseline-report exp76-stage18-report/OBJECT_DIAGNOSTIC.json \
            --clang-bin android-clang-prebuilt/clang-r563880c/bin \
            --timeout 140

      - name: Compile 10 RT Kbuild-selected cross-subsystem objects (22 selected total, NO LINK)
        shell: bash
        timeout-minutes: 26
        run: |
          set -euo pipefail
          python3 tools/exp76-stage46-cross-subsystem-coverage.py \
            --kernel exp76-trial-overlay \
            --output exp76-stage18-out \
            --report exp76-stage46-report \
            --baseline-report exp76-stage18-report/OBJECT_DIAGNOSTIC.json \
            --prior-coverage exp76-stage30-report/OBJECT_COVERAGE.json \
            --clang-bin android-clang-prebuilt/clang-r563880c/bin \
            --timeout 120
          test -f exp76-stage46-report/OBJECT_COVERAGE_CROSS_SUBSYSTEM.json

      - name: Diagnose Kbuild kernel subtree archive after 22/22 objects (NO VMLINUX)
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          python3 tools/exp76-stage50-kernel-subtree.py \
            --kernel exp76-trial-overlay \
            --output exp76-stage18-out \
            --report exp76-stage50-report \
            --baseline-report exp76-stage18-report/OBJECT_DIAGNOSTIC.json \
            --prior-coverage exp76-stage30-report/OBJECT_COVERAGE.json \
            --cross-coverage exp76-stage46-report/OBJECT_COVERAGE_CROSS_SUBSYSTEM.json \
            --clang-bin android-clang-prebuilt/clang-r563880c/bin \
            --timeout 570
          test -f exp76-stage50-report/KERNEL_SUBTREE_DIAGNOSTIC.json

      - name: Diagnose MM memory-management archive after kernel subtree gate (NONFLASH)
        shell: bash
        timeout-minutes: 13
        run: |
          set -euo pipefail
          python3 tools/exp76-stage66-mm-subtree.py \
            --kernel exp76-trial-overlay \
            --output exp76-stage18-out \
            --report exp76-stage66-report \
            --stage50-report exp76-stage50-report/KERNEL_SUBTREE_DIAGNOSTIC.json \
            --clang-bin android-clang-prebuilt/clang-r563880c/bin \
            --timeout 570
          test -f exp76-stage66-report/MM_SUBTREE_DIAGNOSTIC.json

      - name: Diagnose FS filesystem subtree after kernel and MM archives (NONFLASH)
        shell: bash
        timeout-minutes: 13
        run: |
          set -euo pipefail
          python3 tools/exp76-stage67-fs-subtree.py \
            --kernel exp76-trial-overlay \
            --output exp76-stage18-out \
            --report exp76-stage67-report \
            --stage50-report exp76-stage50-report/KERNEL_SUBTREE_DIAGNOSTIC.json \
            --stage66-report exp76-stage66-report/MM_SUBTREE_DIAGNOSTIC.json \
            --clang-bin android-clang-prebuilt/clang-r563880c/bin \
            --timeout 570
          test -f exp76-stage67-report/FS_SUBTREE_DIAGNOSTIC.json

      - name: Diagnose IPC messaging archive after kernel, MM and FS gates (NONFLASH)
        shell: bash
        timeout-minutes: 13
        run: |
          set -euo pipefail
          python3 tools/exp76-stage68-ipc-subtree.py \
            --kernel exp76-trial-overlay \
            --output exp76-stage18-out \
            --report exp76-stage68-report \
            --stage50-report exp76-stage50-report/KERNEL_SUBTREE_DIAGNOSTIC.json \
            --stage66-report exp76-stage66-report/MM_SUBTREE_DIAGNOSTIC.json \
            --stage67-report exp76-stage67-report/FS_SUBTREE_DIAGNOSTIC.json \
            --clang-bin android-clang-prebuilt/clang-r563880c/bin \
            --timeout 570
          test -f exp76-stage68-report/IPC_SUBTREE_DIAGNOSTIC.json

      - name: Diagnose SELinux/security subtree after classified IPC gate (NONFLASH)
        shell: bash
        timeout-minutes: 13
        run: |
          set -euo pipefail
          python3 tools/exp76-stage69-security-subtree.py \
            --kernel exp76-trial-overlay \
            --output exp76-stage18-out \
            --report exp76-stage69-report \
            --stage50-report exp76-stage50-report/KERNEL_SUBTREE_DIAGNOSTIC.json \
            --stage66-report exp76-stage66-report/MM_SUBTREE_DIAGNOSTIC.json \
            --stage67-report exp76-stage67-report/FS_SUBTREE_DIAGNOSTIC.json \
            --stage68-report exp76-stage68-report/IPC_SUBTREE_DIAGNOSTIC.json \
            --clang-bin android-clang-prebuilt/clang-r563880c/bin \
            --timeout 570
          test -f exp76-stage69-report/SECURITY_SUBTREE_DIAGNOSTIC.json

      - name: Diagnose NET networking Kbuild archive after security (NONFLASH)
        shell: bash
        timeout-minutes: 13
        run: |
          set -euo pipefail
          python3 tools/exp76-stage72-net-subtree.py \
            --kernel exp76-trial-overlay \
            --output exp76-stage18-out \
            --report exp76-stage72-report \
            --stage50-report exp76-stage50-report/KERNEL_SUBTREE_DIAGNOSTIC.json \
            --stage66-report exp76-stage66-report/MM_SUBTREE_DIAGNOSTIC.json \
            --stage67-report exp76-stage67-report/FS_SUBTREE_DIAGNOSTIC.json \
            --stage68-report exp76-stage68-report/IPC_SUBTREE_DIAGNOSTIC.json \
            --stage69-report exp76-stage69-report/SECURITY_SUBTREE_DIAGNOSTIC.json \
            --clang-bin android-clang-prebuilt/clang-r563880c/bin \
            --timeout 570
          test -f exp76-stage72-report/NET_SUBTREE_DIAGNOSTIC.json

      - name: Diagnose LIB Kbuild archive after NET verification (NONFLASH)
        shell: bash
        timeout-minutes: 13
        run: |
          set -euo pipefail
          python3 tools/exp76-stage73-lib-subtree.py \
            --kernel exp76-trial-overlay \
            --output exp76-stage18-out \
