# YAML / GitHub Actions Ubuntu 24.04 / EXP76 pinned Clang21 arm64 object diagnostics / NO FLASH
name: EXP76 Clang21 RT scheduler object diagnostics (NO FLASH)

on:
  push:
    branches: [exp76-preempt-rt-uname]
    paths:
      - '.github/workflows/exp76-stage18-clang21-diagnostic.yml'
      - 'tools/exp76-stage18-clang21-object-diagnostic.sh'
      - 'tests/test_exp76_stage22_prepare_parser.py'
      - 'tools/exp76-stage23-prepare-gate.py'
      - 'tests/test_exp76_stage23_prepare_gate.py'
      - 'tools/exp76-stage24-collect-ci-evidence.py'
      - 'tests/test_exp76_stage24_evidence.py'
      - 'tools/exp76-rt-stage19-header-fixes.py'
      - 'tools/exp76-rt-stage20-headers.py'
      - 'tools/exp76-rt-stage21-rcu-include.py'
      - 'tools/exp76-rt-stage26-fork-affinity.py'
      - 'tests/test_exp76_stage26_fork_affinity.py'
      - 'tools/exp76-rt-stage27-core-affinity.py'
      - 'tests/test_exp76_stage27_core_affinity.py'
      - 'tools/exp76-rt-stage28-task-state.py'
      - 'tests/test_exp76_stage28_task_state.py'
      - 'tools/exp76-rt-stage29-migration-abi.py'
      - 'tests/test_exp76_stage29_migration_abi.py'
      - 'tools/exp76-stage30-object-coverage.py'
      - 'tests/test_exp76_stage30_object_coverage.py'
      - 'tools/exp76-rt-stage31-class-affinity.py'
      - 'tests/test_exp76_stage31_class_affinity.py'
      - 'tools/exp76-rt-stage34-timer-swork.py'
      - 'tests/test_exp76_stage34_timer_swork.py'
      - 'tools/exp76-rt-stage35-might-sleep.py'
      - 'tests/test_exp76_stage35_might_sleep.py'
      - 'tools/exp76-stage36-migration-contract.py'
      - 'tests/test_exp76_stage36_migration_contract.py'
      - 'tools/exp76-rt-stage38-softirq-entry.py'
      - 'tests/test_exp76_stage38_softirq_entry.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exp76-stage18-clang21-diagnostic
  cancel-in-progress: false

jobs:
  clang21-object-diagnostic:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      ANDROID_LLVM_COMMIT: b54cd2c8e9e0bb057aef3804d42d39c5ac4674c7
    steps:
      - uses: actions/checkout@v4

      - name: Validate object-only diagnostic scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/exp76-stage18-clang21-object-diagnostic.sh
          python3 tests/test_exp76_stage22_prepare_parser.py
          python3 -m py_compile tools/exp76-stage23-prepare-gate.py
          python3 tests/test_exp76_stage23_prepare_gate.py
          python3 -m py_compile tools/exp76-stage24-collect-ci-evidence.py
          python3 tests/test_exp76_stage24_evidence.py
          python3 -m py_compile tools/exp76-rt-stage26-fork-affinity.py
          python3 tests/test_exp76_stage26_fork_affinity.py
          python3 -m py_compile tools/exp76-rt-stage27-core-affinity.py
          python3 tests/test_exp76_stage27_core_affinity.py
          python3 -m py_compile tools/exp76-rt-stage28-task-state.py
          python3 tests/test_exp76_stage28_task_state.py
          python3 -m py_compile tools/exp76-rt-stage29-migration-abi.py
          python3 tests/test_exp76_stage29_migration_abi.py
          python3 -m py_compile tools/exp76-stage30-object-coverage.py
          python3 tests/test_exp76_stage30_object_coverage.py
          python3 -m py_compile tools/exp76-rt-stage31-class-affinity.py
          python3 tests/test_exp76_stage31_class_affinity.py
          python3 -m py_compile tools/exp76-rt-stage34-timer-swork.py
          python3 tests/test_exp76_stage34_timer_swork.py
          python3 -m py_compile tools/exp76-rt-stage35-might-sleep.py
          python3 tests/test_exp76_stage35_might_sleep.py
          python3 -m py_compile tools/exp76-stage36-migration-contract.py
          python3 tests/test_exp76_stage36_migration_contract.py
          python3 -m py_compile tools/exp76-rt-stage38-softirq-entry.py
          python3 tests/test_exp76_stage38_softirq_entry.py
          ! grep -E 'make[[:space:]].*(Image|vmlinux|boot.img)' tools/exp76-stage30-object-coverage.py
          bash -n tools/exp76-rt-compat-audit.sh
          ! grep -E 'make[[:space:]].*(Image|vmlinux|boot.img)' tools/exp76-stage18-clang21-object-diagnostic.sh
          echo 'EXP76_STAGE18_NO_FLASH_CODE_GATE=PASS'

      - name: Install pinned kernel build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git make bc bison flex libssl-dev libelf-dev libncurses-dev \
            python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            rsync device-tree-compiler
          df -h .

      - name: Obtain exact Android Clang 21 from EXP75
        shell: bash
        run: |
          set -euo pipefail
          mkdir android-clang-prebuilt
          cd android-clang-prebuilt
          git init
          git remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git config core.sparseCheckout true
          printf '/clang-r563880c/\n' > .git/info/sparse-checkout
          git config http.version HTTP/1.1
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 120
          for attempt in 1 2 3; do
            if git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$ANDROID_LLVM_COMMIT" && git checkout --detach FETCH_HEAD; then
              break
            fi
            test "$attempt" -lt 3
            sleep 15
          done
          test "$(git rev-parse HEAD)" = "$ANDROID_LLVM_COMMIT"
          test -x clang-r563880c/bin/clang
          test -x clang-r563880c/bin/ld.lld
          clang-r563880c/bin/clang --version
          clang-r563880c/bin/clang --version | grep -F 'clang version 21.0.0'
          clang-r563880c/bin/clang --version | grep -F 'Android (14054515,'
          rm -rf .git

      - name: Prepare Stage38 source using pinned official RT/E404 patch audit
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          bash tools/exp76-rt-compat-audit.sh > stage18-prior-audit.log 2>&1 || {
            tail -n 100 stage18-prior-audit.log
            exit 1
          }
          test -f exp76-rt-report/stage19/stage19-status.json
          test -f exp76-rt-report/stage20/stage20-status.json
          test -f exp76-rt-report/stage21/stage21-status.json
          test -f exp76-rt-report/stage26/stage26-status.json
          test -f exp76-rt-report/stage27/stage27-status.json
          test -f exp76-rt-report/stage28/stage28-status.json
          test -f exp76-rt-report/stage29/stage29-status.json
          test -f exp76-rt-report/stage31/stage31-status.json
          test -f exp76-rt-report/stage34/stage34-status.json
          test -f exp76-rt-report/stage35/stage35-status.json
          test -f exp76-rt-report/stage36/stage36-status.json
          test -f exp76-rt-report/stage38/stage38-status.json
          test "$(find exp76-trial-overlay -name '*.rej' -type f | wc -l)" -eq 64
          test -f exp76-trial-overlay/kernel/sched/cpupri.c.rej
          echo 'EXP76_STAGE18_SOURCE=PINNED_STAGE38_64_REJECTS'

      - name: Run arm64 prepare gate, then compile only selected scheduler objects
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          bash tools/exp76-stage18-clang21-object-diagnostic.sh

      - name: Compile additional RT scheduler, locking and hotplug objects (NONFLASH)
        shell: bash
        timeout-minutes: 27
        run: |
          set -euo pipefail
          python3 tools/exp76-stage30-object-coverage.py \
            --kernel exp76-trial-overlay \
            --output exp76-stage18-out \
            --report exp76-stage30-report \
            --baseline-report exp76-stage18-report/OBJECT_DIAGNOSTIC.json \
            --clang-bin android-clang-prebuilt/clang-r563880c/bin \
            --timeout 140

      - name: Publish readable CI summary even when compiler fails
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          # Python 3 / GitHub Actions / EXP76 CI human-readable report / NO FLASH
          import json
          import os
          from pathlib import Path

          root = Path('exp76-stage18-report')
          source = root / 'OBJECT_DIAGNOSTIC.json'
          lines = ['### EXP76 Clang 21 diagnostic (NONFLASH)', '']
          if not source.is_file():
              lines += [
                  'No object diagnostic was generated; preparation, toolchain or',
                  'source-audit steps may have stopped earlier.',
              ]
          else:
              data = json.loads(source.read_text(encoding='utf-8'))
              p = data.get('preparation') or {}
              lines += [
                  f"PREPARE completed: {p.get('completed', 'unknown')}",
                  f"PREPARE exit code: {p.get('exit_code', 'unknown')}", '',
                  '| Object | Attempted | Compiled | Exit code |',
                  '|---|---|---|---|',
              ]
              for name, obj in (data.get('targets') or {}).items():
                  lines.append(
                      f"| {name} | {obj.get('attempted')} | "
                      f"{obj.get('compiled')} | {obj.get('exit_code')} |"
                  )
              error_lines = (p.get('errors_excerpt') or [])[:8]
              if error_lines:
                  lines += ['', 'First PREPARE errors:', '']
                  lines += ['    ' + str(item)[:300] for item in error_lines]
          extra_path = Path('exp76-stage30-report/OBJECT_COVERAGE.json')
          if extra_path.is_file():
              extra = json.loads(extra_path.read_text(encoding='utf-8'))
              lines += ['', '### RT object coverage (additional targets)', '']
              lines += [
                  f"Objects attempted: {extra.get('objects_attempted')}",
                  f"Objects compiled: {extra.get('objects_compiled')}",
                  '| Object | Compiled | Exit code |',
                  '|---|---|---|',
              ]
              for name, item in (extra.get('targets') or {}).items():
                  lines.append(f"| {name} | {item.get('compiled')} | {item.get('exit_code')} |")
              contract = extra.get('migration_contract') or {}
              lines += [
                  '',
                  f"migrate_disabled_sched missing definition: {contract.get('migrate_disabled_sched_missing_local_definition')}",
                  'RT runtime contract verified: false',
              ]
          lines += ['', 'KERNEL_BUILT=false; FLASH_READY=false']
          output = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with output.open('a', encoding='utf-8') as stream:
              stream.write('\n'.join(lines) + '\n')
          PY

      - name: Publish diagnostics only (NO Image, NO boot.img)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp76-stage18-clang21-NONFLASH-diagnostic
          path: |
            exp76-stage18-report/
            exp76-stage30-report/
            exp76-rt-report/stage16/
            exp76-rt-report/stage17/
            exp76-rt-report/stage19/
            exp76-rt-report/stage20/
            exp76-rt-report/stage21/
            exp76-rt-report/stage26/
            exp76-rt-report/stage27/
            exp76-rt-report/stage28/
            exp76-rt-report/stage29/
            exp76-rt-report/stage31/
            exp76-rt-report/stage34/
            exp76-rt-report/stage35/
            exp76-rt-report/stage36/
            exp76-rt-report/stage38/
            stage18-prior-audit.log
          if-no-files-found: warn
          retention-days: 30

  publish-ci-evidence:
    # Separate privilege boundary: the kernel compiler job is read-only.
    # The publisher writes bounded JSON only to exp76-ci-evidence.
    if: always()
    needs: clang21-object-diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout pinned source for bounded evidence collector
        if: always()
        uses: actions/checkout@v4
        with:
          path: source

      - name: Obtain object diagnostic artifact from this run
        if: always()
        id: artifact_download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: exp76-stage18-clang21-NONFLASH-diagnostic
          path: incoming

      - name: Checkout isolated CI evidence branch
        if: always()
        uses: actions/checkout@v4
        with:
          ref: exp76-ci-evidence
          path: evidence

      - name: Publish run summary to isolated branch (NO FLASH)
        if: always()
        shell: bash
        env:
          BUILD_JOB_CONCLUSION: ${{ needs.clang21-object-diagnostic.result }}
        run: |
          set -euo pipefail
          test -d evidence/.git
          test -f source/tools/exp76-stage24-collect-ci-evidence.py
          python3 source/tests/test_exp76_stage24_evidence.py
          python3 source/tools/exp76-stage24-collect-ci-evidence.py \
            --artifact-root incoming \
            --evidence-root evidence \
            --repo "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --job-conclusion "$BUILD_JOB_CONCLUSION"
          git -C evidence config user.name 'github-actions[bot]'
          git -C evidence config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C evidence add ci-evidence/
          if ! git -C evidence diff --cached --quiet; then
            git -C evidence commit -m "ci(exp76): record Clang21 evidence run $GITHUB_RUN_ID"
            git -C evidence push origin HEAD:exp76-ci-evidence
          fi
          echo 'EXP76_STAGE24_EVIDENCE=PUBLISHED; SOURCE_BRANCH_UNTOUCHED=true; FLASH_READY=false'
