              for path in (stage82.get('priority_order') or [])[:10]:
                  lines.append('    ' + str(path)[:160])
          stage83_path = Path('exp76-rt-report/stage83/stage83-status.json')
          if stage83_path.is_file():
              stage83 = json.loads(stage83_path.read_text(encoding='utf-8'))
