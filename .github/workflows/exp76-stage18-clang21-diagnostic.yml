          python3 -m py_compile tools/exp76-stage87-kasan-vendor-equivalence.py
          python3 tests/test_exp76_stage87_kasan_vendor_equivalence.py
          python3 -m py_compile tools/exp76-stage88-rt-kconfig-guards.py
          python3 tests/test_exp76_stage88_rt_kconfig_guards.py
          python3 -m py_compile tools/exp76-stage89-proc-swait.py
          python3 tests/test_exp76_stage89_proc_swait.py
          python3 -m py_compile tools/exp76-stage90-rt-uts-version.py
          python3 tests/test_exp76_stage90_rt_uts_version.py
