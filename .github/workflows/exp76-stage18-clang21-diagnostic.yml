          python3 tests/test_exp76_stage77_compile_h_preflight.py
          python3 -m py_compile tools/exp76-rt-stage79-functionfs-swait.py
          python3 tests/test_exp76_stage79_functionfs_swait.py
          python3 -m py_compile tools/exp76-stage81-block-init-subtrees.py
          python3 tests/test_exp76_stage81_block_init_subtrees.py
          python3 -m py_compile tools/exp76-stage82-rt-reject-inventory.py
          python3 tests/test_exp76_stage82_rt_reject_inventory.py
          python3 -m py_compile tools/exp76-rt-stage83-arm64-neon-crypto.py
