# YAML / GitHub Actions Ubuntu24 / EXP76 R30 V3 exact Image QEMU PTY BREAK SysRq-t task stacks / NO FLASH
name: EXP76 R30 V3 pinned module insmod SysRq-t stacks (NO FLASH)
on:
  push:
    branches: [exp76-rt-pa-lock-fix]
    paths:
      - '.github/workflows/exp76-r30-v3-sysrq.yml'
      - 'tools/exp76-r30-qemu-pty-sysrq.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  v3-pinned-sysrq:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Download exact RT140 V3 Image and initramfs from 42654102716
        uses: actions/download-artifact@v4
        with:
          name: exp76-r30-spinlock-v3-qemu-NOFLASH
          run-id: 42654102716
          repository: nywuer777/Pipa-Experimental-Kernel
          github-token: ${{ github.token }}
          path: r30-pinned/v3-original
      - name: Install only QEMU aarch64 for frozen binary forensic re-execution
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-arm
          command -v qemu-system-aarch64
          python3 -m py_compile tools/exp76-r30-qemu-pty-sysrq.py
      - name: Capture serial BREAK+SysRq-t while insmod is stalled; archive full raw console
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          I=r30-pinned/v3-original
          test -s "$I/r23b/output/arch/arm64/boot/Image"
          test -s "$I/r30/reports/v3/v3-initramfs.cpio.gz"
          sha256sum "$I/r23b/output/arch/arm64/boot/Image" "$I/r30/reports/v3/v3-initramfs.cpio.gz"
          python3 tools/exp76-r30-qemu-pty-sysrq.py \
            --kernel "$I/r23b/output/arch/arm64/boot/Image" \
            --initrd "$I/r30/reports/v3/v3-initramfs.cpio.gz" \
            --out r30-pinned/sysrq \
            --before-break 6 --after-break 12
          test -s r30-pinned/sysrq/sysrq-audit.json
          test -s r30-pinned/sysrq/console-full.txt
      - name: Archive serial source and sysrq forensic SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp76-r30-v3-frozen-insmod-sysrq-NOFLASH
          path: r30-pinned/sysrq/
          if-no-files-found: warn
          retention-days: 30
