# YAML / GitHub Actions Ubuntu24 / EXP76 R30 Stage82 pa_lock pairing patch RT140 QEMU / NO FLASH
name: EXP76 R30 RT spinlock sleep V3 QEMU proof (NO FLASH)
on:
  push:
    branches: [exp76-rt-pa-lock-fix]
    paths:
      - '.github/workflows/exp76-r30-v3.yml'
      - 'tools/exp76-r30-v3-initramfs.py'
      - 'tools/exp76-r30-v3-timer-irq-guard.py'
      - 'tools/exp76-r30-v3-initramfs.py'
      - 'tests/exp76-rt-spin-sleep/exp76_rt_spin_sleep.c'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  e404-minimal-rt:
    runs-on: ubuntu-24.04
    timeout-minutes: 230
    env:
      E404_BASE: fed88a6024cd4d46c52eda607a95d97d7371ba81
      ANDROID_LLVM_COMMIT: b54cd2c8e9e0bb057aef3804d42d39c5ac4674c7
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CLANG_TRIPLE: aarch64-linux-gnu-
      LLVM_IAS: "1"
      HOSTCC: gcc
    steps:
      - uses: actions/checkout@v4
      - name: Download exact EXP76 ARM64 smoke initramfs
        uses: actions/download-artifact@v4
        with:
          name: exp76-qemu-rt-functional-NOFLASH
          run-id: 42250522391
          repository: nywuer777/Pipa-Experimental-Kernel
          github-token: ${{ github.token }}
          path: r23b/inputs
      - name: Install build tools, QEMU and source dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r23b/reports r23b/logs r23b/output exp76-qemu/reports exp76-qemu/logs r30/reports/step3 r30/reports/step4
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git curl ca-certificates make bc bison flex libssl-dev libelf-dev libncurses-dev python3 gcc-aarch64-linux-gnu rsync device-tree-compiler qemu-system-arm busybox-static cpio gzip xz-utils e2fsprogs
      - name: Obtain exactly pinned Android Clang21
        shell: bash
        run: |
          set -euo pipefail
          mkdir android-clang-prebuilt
          cd android-clang-prebuilt
          git init
          git remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git config core.sparseCheckout true
          printf '/clang-r563880c/\n' > .git/info/sparse-checkout
          git config http.version HTTP/1.1
          for attempt in 1 2 3; do
            if git -c protocol.version=2 fetch --depth=1 --filter=blob:none \
              origin "$ANDROID_LLVM_COMMIT" && git checkout --detach FETCH_HEAD; then
              break
            fi
            test "$attempt" -lt 3
            sleep 15
          done
          test "$(git rev-parse HEAD)" = "$ANDROID_LLVM_COMMIT"
          test -x clang-r563880c/bin/clang
          test -x clang-r563880c/bin/ld.lld
          test -x clang-r563880c/bin/llvm-objcopy
          clang-r563880c/bin/clang --version | grep -F 'clang version 21.0.0'
      - name: Reconstruct exact E404 RT140 with previous EXP76 compatibility source ports
        shell: bash
        timeout-minutes: 48
        run: |
          set -euo pipefail
          bash tools/exp76-rt-compat-audit.sh > exp76-qemu/logs/source-reconstruction.log 2>&1 || {
            tail -n 120 exp76-qemu/logs/source-reconstruction.log
            exit 1
          }
          test "$(git -C exp76-trial-overlay rev-parse HEAD)" = "$E404_BASE"
          # Restore the pinned KernelSU gitlink; drivers/kernelsu is a
          # symlink to ../KernelSU/kernel. Do not delete a required source.
          python3 tools/exp76-kconfig-source-audit.py \
            --tree exp76-trial-overlay --arch arm64 \
            --output exp76-qemu/reports/e404-kconfig-missing-sources.json
          git -C exp76-trial-overlay submodule update --init --recursive KernelSU \
            > exp76-qemu/logs/ksu-submodule-init.log 2>&1 || {
              cat exp76-qemu/logs/ksu-submodule-init.log
              echo 'BLOCKED_SUBMODULE_KERNELSU'; exit 2;
            }
          git -C exp76-trial-overlay submodule status \
            > exp76-qemu/reports/ksu-gitlink-status.txt
          test -f exp76-trial-overlay/drivers/kernelsu/Kconfig || {
            echo 'BLOCKED_KCONFIG_KERNELSU_UNRESOLVED'; exit 2;
          }
          python3 tools/exp76-kconfig-source-audit.py \
            --tree exp76-trial-overlay --arch arm64 \
            --output exp76-qemu/reports/e404-kconfig-after-submodule.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('exp76-qemu/reports/e404-kconfig-after-submodule.json').read_text())
          print('KCONFIG_MISSING_AFTER_SUBMODULE=', d['missing_source_paths_count'])
          assert 'drivers/kernelsu/Kconfig' not in d['missing_source_paths']
          PY
          python3 tools/exp76-stage82-rt-reject-inventory.py \
            --tree exp76-trial-overlay \
            --manifest exp76-rt-report/overlay/rejected-paths.txt \
            --report exp76-qemu/reports/stage82
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('exp76-qemu/reports/stage82/RT_REJECT_HUNK_INVENTORY.json').read_text())
          assert d['remaining_rejected_files']==64
          assert d['total_rejected_hunks']==209
          assert d['source_modified'] is False and d['rejects_deleted'] is False
          PY
          python3 tools/exp76-rt-stage83-arm64-neon-crypto.py \
            --tree exp76-trial-overlay \
            --index exp76-qemu/reports/stage82/RT_REJECT_HUNK_INVENTORY.json \
            --report exp76-qemu/reports/stage83 --mode apply
          python3 tools/exp76-stage88-rt-kconfig-guards.py \
            --tree exp76-trial-overlay \
            --index exp76-qemu/reports/stage82/RT_REJECT_HUNK_INVENTORY.json \
            --report exp76-qemu/reports/stage88 --mode apply
          python3 tools/exp76-stage89-proc-swait.py \
            --tree exp76-trial-overlay \
            --inventory exp76-qemu/reports/stage82/RT_REJECT_HUNK_INVENTORY.json \
            --report exp76-qemu/reports/stage89 --mode apply
          python3 tools/exp76-stage90-rt-uts-version.py \
            --tree exp76-trial-overlay \
            --index exp76-qemu/reports/stage82/RT_REJECT_HUNK_INVENTORY.json \
            --report exp76-qemu/reports/stage90 --mode apply
          python3 tools/exp76-stage91-pid-atomic-header.py \
            --tree exp76-trial-overlay \
            --index exp76-qemu/reports/stage82/RT_REJECT_HUNK_INVENTORY.json \
            --report exp76-qemu/reports/stage91 --mode apply
          python3 tools/exp76-rt-stage74-radix-locallock.py \
            --tree exp76-trial-overlay \
            --report exp76-qemu/reports/stage74 --mode apply
          python3 tools/exp76-rt-stage79-functionfs-swait.py \
            --tree exp76-trial-overlay \
            --report exp76-qemu/reports/stage79 --mode apply
          python3 tools/exp76-rt-stage85-rwsem-idr-link.py \
            --tree exp76-trial-overlay \
            --report exp76-qemu/reports/stage85 --mode apply
          # Fix the exact Clang21 VirtIO declaration in the disposable E404 tree.
          # Keep QEMU VirtIO enabled; the fix is included in source-diff.sha256.
          python3 tools/exp76-qemu-virtio-clang21.py \
            --tree exp76-trial-overlay \
            --report exp76-qemu/reports/virtio-clang21-compat.json \
            --mode apply
          # E404 rt.c references the energy static key without a Kconfig guard.
          # sched_energy_enabled() has an intentional false fallback with ENERGY_MODEL=n.
          python3 - <<'PY'
          # Python 3 / Ubuntu 24.04 / patch exactly one E404 RT scheduler reference in disposable QEMU tree
          from pathlib import Path
          p=Path('exp76-trial-overlay/kernel/sched/rt.c')
          s=p.read_text()
          old='static_branch_unlikely(&sched_energy_present)'
          assert s.count(old)==1, f'unexpected rt.c static key occurrences: {s.count(old)}'
          assert 'static inline bool sched_energy_enabled(void) { return false; }' in Path('exp76-trial-overlay/kernel/sched/sched.h').read_text(), 'unconditional helper missing'
          p.write_text(s.replace(old, 'sched_energy_enabled()'))
          PY
          # Retain RT RCU quiescent-state API; use E404 vendor API in nonRT.
          python3 tools/exp76-qemu-nonrt-rcu-qs.py \
            --tree exp76-trial-overlay \
            --report exp76-qemu/reports/nonrt-softirq-rcu-qs.json
          python3 tools/exp76-rt19-timer-swork-order.py \
            --tree exp76-trial-overlay \
            --report exp76-qemu/reports/r19-timer-swork-order.json \
            --mode apply
          python3 tools/exp76-rt22-h10-verify.py \
            --tree exp76-trial-overlay \
            --report exp76-qemu/reports/r22-h10-source-gate.json
          test "$(find exp76-trial-overlay -name '*.rej' -type f | wc -l)" -eq 64
          git -C exp76-trial-overlay diff --check
          git -C exp76-trial-overlay diff --binary | sha256sum \
            > exp76-qemu/reports/source-diff.sha256
      - name: Apply exactly 3 rejected RT140 mm/page_alloc hunks (source only; no Kconfig changes)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/exp76-r30-pa-lock-fix.py \
            --tree exp76-trial-overlay \
            --out r30/reports/step3
          test -s r30/reports/step3/mm-page-alloc-stage82-fix.patch
          test "$(find exp76-trial-overlay -type f -name '*.rej' | wc -l)" -eq 64
          git -C exp76-trial-overlay diff --check
          git -C exp76-trial-overlay diff -- mm/page_alloc.c >r30/reports/step3/combined-upstream-and-r30-mm.diff
          sha256sum r30/reports/step3/* >r30/reports/step3/files.sha256
          sha256sum exp76-trial-overlay/mm/page_alloc.c
      - name: V3-only guard for observed ktimersoftd irq_work_tick_soft BRK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r30/reports/v3
          python3 tools/exp76-r30-v3-timer-irq-guard.py \
            --tree exp76-trial-overlay \
            --out r30/reports/v3
          test -s r30/reports/v3/timer-v3-irq-guard.patch
          git -C exp76-trial-overlay diff --check
      - name: Generate minimal effective QEMU_RT config and measure Kconfig reselections
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/android-clang-prebuilt/clang-r563880c/bin:$PATH"
          K="$GITHUB_WORKSPACE/exp76-trial-overlay"
          O="$GITHUB_WORKSPACE/r23b/output"
          make -C "$K" O="$O" ARCH=arm64 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- allnoconfig >r23b/reports/base-config.log 2>&1
          "$K/scripts/config" --file "$O/.config" -d LTO_CLANG -d LTO_CLANG_THIN -d LTO_CLANG_FULL -e LTO_NONE -d PREEMPT -e PREEMPT_RT_FULL -e SMP -e HIGH_RES_TIMERS -e EXPERT -e TTY -e OF -e ARM_AMBA -e SERIAL_CORE -e SERIAL_CORE_CONSOLE -e SERIAL_AMBA_PL011 -e SERIAL_AMBA_PL011_CONSOLE -e BLK_DEV_INITRD -e DEVTMPFS -e DEVTMPFS_MOUNT -e MAGIC_SYSRQ -e MAGIC_SYSRQ_SERIAL -e PRINTK -e BINFMT_ELF -e BINFMT_SCRIPT -e MODULES -e MODULE_UNLOAD -e MULTIUSER -e PROC_FS -e SYSFS -e ARM_PSCI_FW -e ARM_GIC -e COMPAT -e CPU_FREQ -e CPU_FREQ_GOV_SCHEDUTIL -d ENERGY_MODEL -e FUTEX -e SYNC_FILE -d BPF_SYSCALL -d CGROUP_BPF
          # E404 ARM64 Kconfig declares these as int without defaults.
          # allnoconfig emits empty values; syncconfig otherwise loops without stdin.
          "$K/scripts/config" --file "$O/.config" --set-val LITTLE_CPU_MASK 0 --set-val BIG_CPU_MASK 0 --set-val PRIME_CPU_MASK 0 --set-val NR_CPUS 8
          python3 - <<'PY'
          # Python 3 / Ubuntu 24.04 / collect exact requested disabled configs
          from pathlib import Path
          import json
          off=['QCOM_SCM','QCOM_SMEM','QCOM_SMD','QCOM_RPMH','QCOM_GLINK','QCOM_MDT_LOADER','MSM_KGSL','QCOM_KGSL','VIRTIO','VIRTIO_MENU','VIRTIO_MMIO','VIRTIO_BLK','PCI','PCIE','NET','STAGING','QCA_CLD_WLAN','WIRELESS','WLAN','QCOM_CLK_RPMH','QCOM_COMMAND_DB','BPF_SYSCALL','CGROUP_BPF','MHI_BUS','MHI_QCOM','MHI_NETDEV','MHI_UCI','MHI_SATELLITE','SYSCTL']
          Path('r23b/reports/disabled-requested.json').write_text(json.dumps(off,indent=2)+'\n')
          PY
          for iter in 1 2 3 4; do
            python3 - <<'PY'
          # Python 3 / Ubuntu24 / Kconfig scripts/config disables exact requested symbols
          import json,subprocess
          off=json.load(open('r23b/reports/disabled-requested.json'))
          subprocess.run(['exp76-trial-overlay/scripts/config','--file','r23b/output/.config']+sum((['-d',x] for x in off),[]),check=True)
          PY
            make -C "$K" O="$O" ARCH=arm64 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig >>r23b/reports/base-config.log 2>&1
            cp "$O/.config" "r23b/reports/kconfig-round-$iter.config"
          done
          python3 - <<'PY'
          # Python 3 / Ubuntu24 / report Kconfig symbols automatically reselected
          import hashlib,json
          from pathlib import Path
          desired=json.load(open('r23b/reports/disabled-requested.json'))
          txt=Path('r23b/output/.config').read_text()
          found={}
          for x in desired:
              name='CONFIG_'+x
              found[x]=next((v.split('=',1)[1] for v in txt.splitlines() if v.startswith(name+'=')),'n')
          result={'requested_disabled':desired,'effective':found,
                  'kconfig_reselections':[x for x,v in found.items() if v!='n'],
                  'effective_config_sha256':hashlib.sha256(txt.encode()).hexdigest(),
                  'iterations':4,'arch_timer_symbol_note':'CONFIG_ARCH_TIMER absent in previous E404 effective configs; ARM_ARCH_TIMER is requested on vanilla'}
          Path('r23b/reports/kconfig-reselections.json').write_text(json.dumps(result,indent=2)+'\n')
          print('EXP76_R23_B_RESELECTED',result['kconfig_reselections'])
          PY
          for key in LITTLE_CPU_MASK BIG_CPU_MASK PRIME_CPU_MASK; do
            grep -qx "CONFIG_${key}=0" "$O/.config" || { echo "R23_B2_INVALID_CPU_MASK_${key}"; exit 31; }
          done
          for required in COMPAT CPU_FREQ CPU_FREQ_GOV_SCHEDUTIL FUTEX RT_MUTEXES SYNC_FILE DMA_SHARED_BUFFER BINFMT_SCRIPT MODULES MODULE_UNLOAD MULTIUSER PROC_FS SYSFS; do
            grep -qx "CONFIG_${required}=y" "$O/.config" || { echo "R23_B2_REQUIRED_${required}_NOT_Y"; exit 32; }
          done
          grep -qx '# CONFIG_ENERGY_MODEL is not set' "$O/.config" || { echo R23_B2_ENERGY_MODEL_RESELECTED; exit 34; }
          grep -qx 'CONFIG_NR_CPUS=8' "$O/.config" || { echo R23_B2_NR_CPUS_INVALID; exit 33; }
          grep -qx 'CONFIG_PREEMPT_RT_FULL=y' "$O/.config"
          grep -qx 'CONFIG_SMP=y' "$O/.config"
          grep -qx 'CONFIG_SERIAL_AMBA_PL011=y' "$O/.config"
          grep -qx 'CONFIG_SERIAL_AMBA_PL011_CONSOLE=y' "$O/.config"
          if grep -qx 'CONFIG_QCA_CLD_WLAN=y' "$O/.config"; then echo 'R23_B_WLAN_RESELECTED'; exit 8; fi
          if grep -qx 'CONFIG_STAGING=y' "$O/.config"; then echo 'R23_B_STAGING_RESELECTED'; exit 8; fi
          if grep -qx 'CONFIG_NET=y' "$O/.config"; then echo 'R23_B_NET_RESELECTED'; exit 8; fi
          cp "$O/.config" r23b/reports/effective.config
          sha256sum "$O/.config" >r23b/reports/config-sha256.txt
          # V3 requires PROC_FS/SYSFS for /proc/sysrq-trigger and dmesg context.
          # MULTIUSER restores root capability checks for insmod; build step records config delta.
          echo R30_V3_MODULE_CONFIG_ALLOWED_CHANGE_FROM_BASELINE
          grep -qx 'CONFIG_MODULES=y' "$O/.config"
          grep -qx 'CONFIG_MODULE_UNLOAD=y' "$O/.config"
          for x in MULTIUSER PROC_FS SYSFS; do grep -qx "CONFIG_${x}=y" "$O/.config" || exit 37; done
          sha256sum "$O/.config"
      - name: Build minimal E404 RT ARM64 Image and boot QEMU
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          export ANDROID_CLANG_BIN="$GITHUB_WORKSPACE/android-clang-prebuilt/clang-r563880c/bin"
          python3 tools/exp76-rt23-build-boot.py --track B --tree exp76-trial-overlay --output r23b/output --reports r23b/reports --initramfs r23b/inputs/smoke-initramfs.cpio.gz --build-seconds 1200 --qemu-seconds 45
      - name: Compile actual exp76_rt_spin_sleep.ko against exact corrected QEMU_RT kernel
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p r30/reports/v3
          export PATH="$GITHUB_WORKSPACE/android-clang-prebuilt/clang-r563880c/bin:$PATH"
          K="$GITHUB_WORKSPACE/exp76-trial-overlay"
          O="$GITHUB_WORKSPACE/r23b/output"
          MOD="$GITHUB_WORKSPACE/tests/exp76-rt-spin-sleep"
          make -C "$K" O="$O" ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM_IAS=1 HOSTCC=gcc -j4 M="$MOD" modules \
            >r30/reports/v3/module-build.log 2>&1 || {
              tail -n 120 r30/reports/v3/module-build.log
              exit 43
            }
          test -s "$MOD/exp76_rt_spin_sleep.ko"
          sha256sum "$MOD/exp76_rt_spin_sleep.ko" >r30/reports/v3/module.sha256
      - name: Pack V3 module, gate.sh and effective RT Kconfig into original QEMU initramfs
        shell: bash
        run: |
          set -euo pipefail
          # Root is needed to preserve original /dev/console and /dev/null device nodes.
          sudo python3 tools/exp76-r30-v3-initramfs.py \
            --original r23b/inputs/smoke-initramfs.cpio.gz \
            --module tests/exp76-rt-spin-sleep/exp76_rt_spin_sleep.ko \
            --config r23b/output/.config \
            --gate tests/exp76-rt-spin-sleep/run-in-guest.sh \
            --output r30/reports/v3/v3-initramfs.cpio.gz \
            --report r30/reports/v3/step5-initramfs.json
          sudo chown -R "$(id -u):$(id -g)" r30/reports/v3
          test -s r30/reports/v3/v3-initramfs.cpio.gz
      - name: Boot corrected RT with real spinlock V3 module and verify guest timings
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p r30/reports/v3
          set +e
          timeout --signal=TERM --kill-after=5 85 \
            qemu-system-aarch64 -M virt -cpu cortex-a72 -smp 4 -m 512 \
            -nodefaults -serial stdio -monitor none -display none -nic none -no-reboot \
            -kernel r23b/output/arch/arm64/boot/Image \
            -initrd r30/reports/v3/v3-initramfs.cpio.gz \
            -append "earlycon=pl011,0x09000000 console=ttyAMA0,115200 loglevel=8 ignore_loglevel printk.time=1 nokaslr panic=5 initcall_debug=1 init=/init" \
            >r30/reports/v3/console-full.txt 2>&1
          qemu_rc=$?
          set -e
          printf '%s\n' "$qemu_rc" >r30/reports/v3/qemu-rc.txt
          set +e
          bash tests/exp76-rt-spin-sleep/run-in-guest.sh verify normal \
            r23b/output/.config r30/reports/v3/console-full.txt \
            >r30/reports/v3/host-verifier.txt 2>&1
          verifier_rc=$?
          set -e
          printf '%s\n' "$verifier_rc" >r30/reports/v3/host-verifier-rc.txt
          python3 - <<'PY'
          # Python 3 / GH ubuntu 24 / independent serial verification of real RT module and host verifier
          import hashlib,json,re
          from pathlib import Path
          d=Path('r30/reports/v3')
          raw=(d/'console-full.txt').read_bytes()
          txt=raw.decode('utf-8','replace')
          lines=txt.splitlines()
          ms=[float(x)*1000 for x in re.findall(r'(?m)^\[\s*(\d+\.\d+)\]',txt)]
          marks=[
              'EXP76_RT_SPIN_SLEEP CONTENTION_PASS wait_us=',
              'EXP76_RT_SPIN_SLEEP PASS elapsed_us=',
              'EXP76_RT_SPIN_SLEEP END status=PASS',
              'RT_SEMANTICS_VERIFIED=PASS'
          ]
          present={m: m in txt for m in marks}
          host_verifier=(d/'host-verifier.txt').read_text(errors='replace')
          qemu_rc=int((d/'qemu-rc.txt').read_text())
          verify_rc=int((d/'host-verifier-rc.txt').read_text())
          val={'schema_version':1,'track':'R30-V3','guest_running':'EXP76_QEMU_RT_SMOKE=GUEST_RUNNING' in txt,
               'kernel_preempt_rt_full':True,'qemu_exit_code':qemu_rc,
               'verifier_exit_code':verify_rc,'verifier_text':host_verifier[-2000:],
               'boot_reached_ms':round(max(ms),3) if ms else None,
               'console_sha256':hashlib.sha256(raw).hexdigest(),
               'console_bytes':len(raw),'last_lines':lines[-30:],
               'required_markers_present':present,
               'rt_semantics_verified':'PASS' if qemu_rc==0 and verify_rc==0 and all(present.values()) else 'FAIL',
               'flash_ready':False}
          (d/'step5-v3-result.json').write_text(json.dumps(val,indent=2)+'\n')
          print('EXP76_R30_V3',json.dumps(val,indent=2),flush=True)
          if val['rt_semantics_verified']!='PASS':raise SystemExit(50)
          PY
      - name: SHA256 manifest V3 module, initramfs, source patch and QEMU console
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r30/reports/v3
          for f in r23b/output/arch/arm64/boot/Image r23b/output/vmlinux r23b/output/System.map r23b/output/.config tests/exp76-rt-spin-sleep/exp76_rt_spin_sleep.ko r30/reports/v3/v3-initramfs.cpio.gz r30/reports/v3/console-full.txt r30/reports/step3/mm-page-alloc-stage82-fix.patch; do
            if test -f "$f"; then sha256sum "$f"; fi
          done >r30/reports/v3/manifest.sha256
          cat r30/reports/v3/manifest.sha256
      - name: Always publish config rounds, reselections, raw console, Image ELF and source logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp76-r30-spinlock-v3-qemu-NOFLASH
          path: |
            r30/reports/
            tests/exp76-rt-spin-sleep/exp76_rt_spin_sleep.ko
            r23b/reports/
            r23b/logs/
            r23b/output/.config
            r23b/output/arch/arm64/boot/Image
            r23b/output/vmlinux
            r23b/output/System.map
            exp76-qemu/reports/source-diff.sha256
            exp76-qemu/logs/source-reconstruction.log
          if-no-files-found: warn
          retention-days: 21
