name: Pipa EXP29.25 - Two-Period FrameGen GPU Guard APK (NO FLASH)

on:
  push:
    branches: [main, exp29.25-pair-budget-guard]
    paths:
      - "graphics/pipa-vulkan-x/**"
      - ".github/workflows/exp29.25-pair-budget-guard-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipa-exp29-24-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lab-android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install SPIR-V toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools spirv-tools
          mkdir -p graphics/pipa-vulkan-x/lab-app/app/src/main/assets
          for input in graphics/pipa-vulkan-x/shaders/*.comp; do
            output="graphics/pipa-vulkan-x/lab-app/app/src/main/assets/$(basename "$input").spv"
            glslangValidator -V --target-env vulkan1.1 -S comp "$input" -o "$output"
            spirv-val --target-env vulkan1.1 "$output"
          done
          python3 graphics/pipa-vulkan-x/tests/test_vk_contract.py
          python3 graphics/pipa-vulkan-x/tests/test_lab_contract.py
          python3 graphics/pipa-vulkan-x/tests/test_gpu_benchmark_contract.py
          python3 graphics/pipa-vulkan-x/tests/test_motion_dispatch_regression.py
          python3 graphics/pipa-vulkan-x/tests/test_adaptive_warp_equivalence.py
          python3 graphics/pipa-vulkan-x/tests/test_workgroup_tuning.py
          python3 graphics/pipa-vulkan-x/tests/test_presenter_contract.py
          python3 graphics/pipa-vulkan-x/tests/test_display_timing_contract.py
          python3 graphics/pipa-vulkan-x/tests/test_continuous_scene_contract.py
          python3 graphics/pipa-vulkan-x/tests/test_visual_isolation.py
          python3 graphics/pipa-vulkan-x/tests/test_scene_forensics.py
          python3 graphics/pipa-vulkan-x/tests/test_procedural_v2.py
          python3 graphics/pipa-vulkan-x/tests/test_sustained_gpu_timing.py
          python3 graphics/pipa-vulkan-x/tests/test_cpu_pacing_audit.py
          python3 graphics/pipa-vulkan-x/tests/test_motion_warp_profile.py
          python3 graphics/pipa-vulkan-x/tests/test_scene_3d_contract.py
          python3 graphics/pipa-vulkan-x/tests/test_scene_3d_aspect_fit.py
          python3 graphics/pipa-vulkan-x/tests/test_wsi_orientation_ab.py
          python3 graphics/pipa-vulkan-x/tests/test_gpu_budget_governor.py
          sha256sum graphics/pipa-vulkan-x/lab-app/app/src/main/assets/*.spv | tee exp29.25-shader-sha256.txt

      - name: Android SDK setup
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android SDK, NDK and CMake
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          test -f "$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Generate portable Gradle wrapper for source artifact
        run: |
          set -euo pipefail
          gradle --no-daemon --project-dir graphics/pipa-vulkan-x/lab-app wrapper --gradle-version 8.13

      - name: Assemble standalone experimental lab APK
        run: |
          set -euo pipefail
          gradle --no-daemon --project-dir graphics/pipa-vulkan-x/lab-app :app:assembleDebug 2>&1 | tee exp29.25-gradle-build.log
          APK="graphics/pipa-vulkan-x/lab-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee exp29.25-apk-sha256.txt
          echo "EXP29_25_PAIR_BUDGET_APK_BUILT_UNTESTED_ON_DEVICE=PASS" | tee exp29.25-status.txt
          echo "NO_KERNEL_FLASH=true" | tee -a exp29.25-status.txt

      - name: Publish APK and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipa-exp29-24-adaptive-gpu-budget-${{ github.run_number }}
          path: |
            graphics/pipa-vulkan-x/lab-app/app/build/outputs/apk/debug/app-debug.apk
            graphics/pipa-vulkan-x/lab-app/gradlew
            graphics/pipa-vulkan-x/lab-app/gradlew.bat
            graphics/pipa-vulkan-x/lab-app/gradle/wrapper/gradle-wrapper.jar
            graphics/pipa-vulkan-x/lab-app/gradle/wrapper/gradle-wrapper.properties
            graphics/pipa-vulkan-x/lab-app/app/src/main/assets/*.spv
            exp29.25-shader-sha256.txt
            exp29.25-apk-sha256.txt
            exp29.25-gradle-build.log
            exp29.25-status.txt
          if-no-files-found: warn
          retention-days: 14
