name: EXP25A Baseline Workflow Validation
on:
  push:
    branches: [exp25a-baseline-tracing]
    paths:
      - ".github/workflows/exp25a-baseline-tracing.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate baseline source files
        shell: bash
        run: |
          set -euo pipefail
          test -s PipaExperimental-EXP01-source.zip
          test -s tools/exp25-apply-touch.py
          test -s tools/exp24-apply-ethernet.py
          echo "BASELINE_WORKFLOW_BOOTSTRAP_PASS"
