# YAML / GitHub Actions ubuntu-24.04 / EXP76 E404 PREEMPT_RT QEMU negative-control qualification / NO FLASH
name: EXP76 QEMU RT spinlock qualification (NO FLASH)
on:
  push:
    branches:
      - exp76-qemu-virtio-clang21
      - exp76-qemu-virtio-block-io
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exp76-qemu-rt-${{ github.sha }}
  cancel-in-progress: false

jobs:
  qemu-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      E404_BASE: fed88a6024cd4d46c52eda607a95d97d7371ba81
      ANDROID_LLVM_COMMIT: b54cd2c8e9e0bb057aef3804d42d39c5ac4674c7
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CLANG_TRIPLE: aarch64-linux-gnu-
      LLVM_IAS: "1"
      HOSTCC: gcc
    steps:
      - uses: actions/checkout@v4

      - name: Preflight V3 guest gate and QEMU PIPA config-diff regressions
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/exp76-rt-spin-sleep/run-in-guest.sh
          bash tests/exp76-rt-spin-sleep/test-log-verifier.sh
          python3 -m py_compile tests/exp76-rt-spin-sleep/check-config-diff.py
          python3 -m py_compile tools/exp76-qemu-virtio-clang21.py
          python3 tools/exp76-qemu-virtio-clang21.py --self-test
          python3 -m py_compile tools/exp76-qemu-nonrt-rcu-qs.py
          python3 tools/exp76-qemu-nonrt-rcu-qs.py --self-test
          python3 tests/exp76-rt-spin-sleep/test-config-diff.py
          git diff --check
          echo 'EXP76_QEMU_STATIC_PREFLIGHT=PASS; QEMU_RUNTIME_NOT_YET_PROVEN'

      - name: Cache downloaded Ubuntu 24.04 apt archives (not dpkg state)
        uses: actions/cache@v4
        with:
          path: exp76-qemu/apt-archives
          key: exp76-apt-${{ runner.os }}-${{ runner.arch }}-ubuntu2404-arm64qemu-v1

      - name: Install pinned dependencies, BusyBox static and ARM64 QEMU
        shell: bash
        run: |
          set -euo pipefail
          # Keep the parent and evidence directories owned by runner.
          mkdir -p exp76-qemu/logs exp76-qemu/reports exp76-qemu/outputs
          mkdir -p exp76-qemu/apt-archives
          APT_ARCHIVES="$GITHUB_WORKSPACE/exp76-qemu/apt-archives"
          sudo mkdir -p "$APT_ARCHIVES/partial"
          sudo chown -R _apt:root "$APT_ARCHIVES"
          sudo chmod 755 "$APT_ARCHIVES"
          sudo chmod 700 "$APT_ARCHIVES/partial"
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Dir::Cache::archives="$APT_ARCHIVES" \
            -o APT::Keep-Downloaded-Packages=true \
            install -y --no-install-recommends \
            git make bc bison flex libssl-dev libelf-dev libncurses-dev python3 \
            gcc-aarch64-linux-gnu rsync device-tree-compiler \
            qemu-system-arm busybox-static cpio gzip xz-utils ccache e2fsprogs
          command -v qemu-system-aarch64
          command -v busybox
          command -v cpio
          mkdir -p exp76-qemu/logs exp76-qemu/reports exp76-qemu/outputs

      - name: Obtain exact EXP75 Android Clang 21
        shell: bash
        run: |
          set -euo pipefail
          mkdir android-clang-prebuilt
          cd android-clang-prebuilt
          git init
          git remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git config core.sparseCheckout true
          printf '/clang-r563880c/\n' > .git/info/sparse-checkout
          git config http.version HTTP/1.1
          for attempt in 1 2 3; do
            if git -c protocol.version=2 fetch --depth=1 --filter=blob:none \
              origin "$ANDROID_LLVM_COMMIT" && git checkout --detach FETCH_HEAD; then
              break
            fi
            test "$attempt" -lt 3
            sleep 15
          done
          test "$(git rev-parse HEAD)" = "$ANDROID_LLVM_COMMIT"
          test -x clang-r563880c/bin/clang
          test -x clang-r563880c/bin/ld.lld
          test -x clang-r563880c/bin/llvm-objcopy
          clang-r563880c/bin/clang --version | grep -F 'clang version 21.0.0'

      - name: Reconstruct pinned E404 plus official RT patch and EXP76 source ports
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          bash tools/exp76-rt-compat-audit.sh > exp76-qemu/logs/source-reconstruction.log 2>&1 || {
            tail -n 120 exp76-qemu/logs/source-reconstruction.log
            exit 1
          }
          test "$(git -C exp76-trial-overlay rev-parse HEAD)" = "$E404_BASE"
          # Restore the pinned KernelSU gitlink; drivers/kernelsu is a
          # symlink to ../KernelSU/kernel. Do not delete a required source.
          python3 tools/exp76-kconfig-source-audit.py \
            --tree exp76-trial-overlay --arch arm64 \
            --output exp76-qemu/reports/e404-kconfig-missing-sources.json
          git -C exp76-trial-overlay submodule update --init --recursive KernelSU \
            > exp76-qemu/logs/ksu-submodule-init.log 2>&1 || {
              cat exp76-qemu/logs/ksu-submodule-init.log
              echo 'BLOCKED_SUBMODULE_KERNELSU'; exit 2;
            }
          git -C exp76-trial-overlay submodule status \
            > exp76-qemu/reports/ksu-gitlink-status.txt
          test -f exp76-trial-overlay/drivers/kernelsu/Kconfig || {
            echo 'BLOCKED_KCONFIG_KERNELSU_UNRESOLVED'; exit 2;
          }
          python3 tools/exp76-kconfig-source-audit.py \
            --tree exp76-trial-overlay --arch arm64 \
            --output exp76-qemu/reports/e404-kconfig-after-submodule.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('exp76-qemu/reports/e404-kconfig-after-submodule.json').read_text())
          print('KCONFIG_MISSING_AFTER_SUBMODULE=', d['missing_source_paths_count'])
          assert 'drivers/kernelsu/Kconfig' not in d['missing_source_paths']
          PY
          python3 tools/exp76-stage82-rt-reject-inventory.py \
            --tree exp76-trial-overlay \
            --manifest exp76-rt-report/overlay/rejected-paths.txt \
            --report exp76-qemu/reports/stage82
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('exp76-qemu/reports/stage82/RT_REJECT_HUNK_INVENTORY.json').read_text())
          assert d['remaining_rejected_files']==64
          assert d['total_rejected_hunks']==209
          assert d['source_modified'] is False and d['rejects_deleted'] is False
          PY
          python3 tools/exp76-rt-stage83-arm64-neon-crypto.py \
            --tree exp76-trial-overlay \
            --index exp76-qemu/reports/stage82/RT_REJECT_HUNK_INVENTORY.json \
            --report exp76-qemu/reports/stage83 --mode apply
          python3 tools/exp76-stage88-rt-kconfig-guards.py \
            --tree exp76-trial-overlay \
            --index exp76-qemu/reports/stage82/RT_REJECT_HUNK_INVENTORY.json \
            --report exp76-qemu/reports/stage88 --mode apply
          python3 tools/exp76-stage89-proc-swait.py \
            --tree exp76-trial-overlay \
            --inventory exp76-qemu/reports/stage82/RT_REJECT_HUNK_INVENTORY.json \
            --report exp76-qemu/reports/stage89 --mode apply
          python3 tools/exp76-stage90-rt-uts-version.py \
            --tree exp76-trial-overlay \
            --index exp76-qemu/reports/stage82/RT_REJECT_HUNK_INVENTORY.json \
            --report exp76-qemu/reports/stage90 --mode apply
          python3 tools/exp76-stage91-pid-atomic-header.py \
            --tree exp76-trial-overlay \
            --index exp76-qemu/reports/stage82/RT_REJECT_HUNK_INVENTORY.json \
            --report exp76-qemu/reports/stage91 --mode apply
          python3 tools/exp76-rt-stage74-radix-locallock.py \
            --tree exp76-trial-overlay \
            --report exp76-qemu/reports/stage74 --mode apply
          python3 tools/exp76-rt-stage79-functionfs-swait.py \
            --tree exp76-trial-overlay \
            --report exp76-qemu/reports/stage79 --mode apply
          python3 tools/exp76-rt-stage85-rwsem-idr-link.py \
            --tree exp76-trial-overlay \
            --report exp76-qemu/reports/stage85 --mode apply
          # Fix the exact Clang21 VirtIO declaration in the disposable E404 tree.
          # Keep QEMU VirtIO enabled; the fix is included in source-diff.sha256.
          python3 tools/exp76-qemu-virtio-clang21.py \
            --tree exp76-trial-overlay \
            --report exp76-qemu/reports/virtio-clang21-compat.json \
            --mode apply
          # Retain RT RCU quiescent-state API; use E404 vendor API in nonRT.
          python3 tools/exp76-qemu-nonrt-rcu-qs.py \
            --tree exp76-trial-overlay \
            --report exp76-qemu/reports/nonrt-softirq-rcu-qs.json
          test "$(find exp76-trial-overlay -name '*.rej' -type f | wc -l)" -eq 64
          git -C exp76-trial-overlay diff --check
          git -C exp76-trial-overlay diff --binary | sha256sum \
            > exp76-qemu/reports/source-diff.sha256

      - name: Generate separate effective PIPA_RT, QEMU_RT and QEMU_NONRT configs
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/android-clang-prebuilt/clang-r563880c/bin:$PATH"
          K="$GITHUB_WORKSPACE/exp76-trial-overlay"
          BASE="$GITHUB_WORKSPACE/exp76-qemu/outputs"
          mkdir -p "$BASE/pipa-rt" "$BASE/qemu-rt" "$BASE/qemu-nonrt"
          make -C "$K" O="$BASE/pipa-rt" ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            vendor/pipa_defconfig > exp76-qemu/logs/pipa-defconfig.log 2>&1
          "$K/scripts/config" --file "$BASE/pipa-rt/.config" \
            -d LTO_CLANG -d LTO_CLANG_THIN -d LTO_CLANG_FULL \
            -e LTO_NONE -d PREEMPT -e PREEMPT_RT_FULL
          make -C "$K" O="$BASE/pipa-rt" ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig >> exp76-qemu/logs/pipa-defconfig.log 2>&1
          grep -qx 'CONFIG_PREEMPT_RT_FULL=y' "$BASE/pipa-rt/.config"
          cp "$BASE/pipa-rt/.config" "$BASE/qemu-rt/.config"
          "$K/scripts/config" --file "$BASE/qemu-rt/.config" \
            -e MODULES -e MODULE_UNLOAD -e ARM_AMBA \
            -e SERIAL_AMBA_PL011 -e SERIAL_AMBA_PL011_CONSOLE \
            -e DEVTMPFS -e DEVTMPFS_MOUNT \
            -e VIRTIO_MENU -e VIRTIO -e VIRTIO_MMIO -e VIRTIO_BLK \
            -e EXT4_FS \
            -e VIRTIO_CONSOLE -e BLK_DEV_INITRD -e BINFMT_ELF \
            -d MODULE_SIG_FORCE
          make -C "$K" O="$BASE/qemu-rt" ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig > exp76-qemu/logs/qemu-rt-olddefconfig.log 2>&1
          for key in CONFIG_PREEMPT_RT_FULL CONFIG_MODULES CONFIG_MODULE_UNLOAD \
                     CONFIG_SERIAL_AMBA_PL011 CONFIG_SERIAL_AMBA_PL011_CONSOLE \
                     CONFIG_DEVTMPFS CONFIG_VIRTIO_MMIO CONFIG_VIRTIO_BLK \
                     CONFIG_EXT4_FS CONFIG_BLK_DEV_INITRD; do
            grep -qx "$key=y" "$BASE/qemu-rt/.config" || {
              echo "BLOCKED_CONFIG: $key != y"; exit 3;
            }
          done
          python3 tests/exp76-rt-spin-sleep/check-config-diff.py \
            --pipa "$BASE/pipa-rt/.config" \
            --qemu "$BASE/qemu-rt/.config" \
            --critical tests/exp76-rt-spin-sleep/rt-critical-configs.txt \
            --report exp76-qemu/reports/QEMU_RT_PIPA_DIFF.json
          cp "$BASE/qemu-rt/.config" "$BASE/qemu-nonrt/.config"
          "$K/scripts/config" --file "$BASE/qemu-nonrt/.config" \
            -d PREEMPT_RT_FULL -e PREEMPT
          make -C "$K" O="$BASE/qemu-nonrt" ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig > exp76-qemu/logs/qemu-nonrt-olddefconfig.log 2>&1
          ! grep -qx 'CONFIG_PREEMPT_RT_FULL=y' "$BASE/qemu-nonrt/.config"
          grep -qx 'CONFIG_MODULES=y' "$BASE/qemu-nonrt/.config"
          grep -qx 'CONFIG_MODULE_UNLOAD=y' "$BASE/qemu-nonrt/.config"

      - name: Restore config/source/Clang-keyed ccache (BUILD only)
        uses: actions/cache@v4
        with:
          path: exp76-qemu/ccache
          key: exp76-ccache-v1-${{ runner.os }}-${{ env.ANDROID_LLVM_COMMIT }}-${{ hashFiles('exp76-qemu/outputs/qemu-rt/.config') }}-${{ hashFiles('exp76-qemu/reports/source-diff.sha256') }}

      - name: Build QEMU RT and nonRT Images directly (PIPA RT already proven), without ccache assertions
        shell: bash
        timeout-minutes: 110
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/android-clang-prebuilt/clang-r563880c/bin:$PATH"
          K="$GITHUB_WORKSPACE/exp76-trial-overlay"
          BASE="$GITHUB_WORKSPACE/exp76-qemu/outputs"
          export CCACHE_DIR="$GITHUB_WORKSPACE/exp76-qemu/ccache"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_TEMPDIR="$RUNNER_TEMP/exp76-ccache-temp"
          mkdir -p "$CCACHE_DIR" "$CCACHE_TEMPDIR"
          # PIPA_RT Image was qualified in run 41930944374; don't rebuild it before boot.
          for variant in qemu-rt qemu-nonrt; do
            echo "EXP76_BOOT_IMAGE_BUILD_BEGIN=$variant"
            set +e
            make -C "$K" O="$BASE/$variant" ARCH=arm64 \
              CC='ccache clang' LD=ld.lld HOSTCC=gcc OBJCOPY=llvm-objcopy \
              CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
              -j"$(nproc)" Image > "exp76-qemu/logs/build-$variant.log" 2>&1
            rc=$?
            set -e
            echo "$rc" > "exp76-qemu/reports/build-$variant-exit-code.txt"
            if [ "$rc" -ne 0 ]; then
              echo "EXP76_BOOT_IMAGE_BUILD_FAIL=$variant EXIT=$rc"
              grep -n -m30 -E 'error:|fatal error:|undefined reference|No rule to make target|Error [0-9]+' \
                "exp76-qemu/logs/build-$variant.log" || true
              tail -n 100 "exp76-qemu/logs/build-$variant.log"
              exit "$rc"
            fi
            test -s "$BASE/$variant/arch/arm64/boot/Image"
            if [ "$variant" != pipa-rt ]; then
              test -s "$BASE/$variant/Module.symvers"
            fi
            sha256sum "$BASE/$variant/.config" \
              "$BASE/$variant/arch/arm64/boot/Image" \
              > "exp76-qemu/reports/sha256-$variant.txt"
            echo "EXP76_BOOT_IMAGE_BUILD_PASS=$variant"
          done

      - name: Build external V3 probe against matching RT and nonRT QEMU kernels
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/android-clang-prebuilt/clang-r563880c/bin:$PATH"
          K="$GITHUB_WORKSPACE/exp76-trial-overlay"
          BASE="$GITHUB_WORKSPACE/exp76-qemu/outputs"
          for variant in qemu-rt qemu-nonrt; do
            M="$GITHUB_WORKSPACE/exp76-qemu/probe-$variant"
            mkdir -p "$M"
            cp tests/exp76-rt-spin-sleep/exp76_rt_spin_sleep.c \
              tests/exp76-rt-spin-sleep/Makefile "$M/"
            make -C "$K" O="$BASE/$variant" ARCH=arm64 \
              CC=clang LD=ld.lld HOSTCC=gcc \
              CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
              M="$M" -j2 modules > "exp76-qemu/logs/module-$variant.log" 2>&1 || {
                tail -n 120 "exp76-qemu/logs/module-$variant.log"; exit 1;
              }
            test -s "$M/exp76_rt_spin_sleep.ko"
            sha256sum "$M/exp76_rt_spin_sleep.ko" \
              > "exp76-qemu/reports/sha256-module-$variant.txt"
          done

      - name: Construct minimal BusyBox initramfs for two QEMU boots
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/exp76-qemu/initramfs"
          mkdir -p "$ROOT/bin" "$ROOT/dev" "$ROOT/proc" "$ROOT/sys" \
            "$ROOT/tmp" "$ROOT/probe" "$ROOT/config" "$ROOT/mnt/virtio"
          # Ubuntu hosted runner is x86_64; guest requires a static AArch64 ELF.
          # Pin the official Noble arm64 package; never copy host BusyBox to guest.
          BB_DEB="exp76-qemu/busybox-static_1.36.1-6ubuntu3.1_arm64.deb"
          curl --fail --location --retry 3 --max-time 90 \
            https://ports.ubuntu.com/ubuntu-ports/pool/main/b/busybox/busybox-static_1.36.1-6ubuntu3.1_arm64.deb \
            --output "$BB_DEB"
          test "$(dpkg-deb --field "$BB_DEB" Architecture)" = arm64
          mkdir -p exp76-qemu/arm64-busybox-pkg
          dpkg-deb --extract "$BB_DEB" exp76-qemu/arm64-busybox-pkg
          BB="$(find exp76-qemu/arm64-busybox-pkg -type f -name busybox | head -n 1)"
          test -n "$BB" && test -s "$BB"
          readelf -h "$BB" > exp76-qemu/reports/arm64-busybox-elf-header.txt
          grep -Eq 'Machine:.*AArch64' exp76-qemu/reports/arm64-busybox-elf-header.txt
          if readelf -l "$BB" | grep -q 'INTERP'; then
            echo 'BLOCKED_BUSYBOX_NOT_STATIC_ARM64'; exit 4
          fi
          cp "$BB" "$ROOT/bin/busybox"
          chmod 0755 "$ROOT/bin/busybox"
          sha256sum "$BB_DEB" "$ROOT/bin/busybox" \
            > exp76-qemu/reports/sha256-busybox-arm64.txt
          echo 'EXP76_BUSYBOX_ARM64_STATIC=PASS'
          for x in sh ash mount mkdir cat grep sed awk tr wc tail head \
                   insmod rmmod dmesg timeout mktemp rm ls echo sync \
                   reboot poweroff sleep uname sha256sum; do
            ln -s busybox "$ROOT/bin/$x"
          done
          cp tests/exp76-rt-spin-sleep/run-in-guest.sh "$ROOT/probe/gate.sh"
          cp exp76-qemu/probe-qemu-rt/exp76_rt_spin_sleep.ko \
            "$ROOT/probe/rt.ko"
          cp exp76-qemu/probe-qemu-nonrt/exp76_rt_spin_sleep.ko \
            "$ROOT/probe/nonrt.ko"
          cp exp76-qemu/outputs/qemu-rt/.config "$ROOT/config/rt.config"
          cp exp76-qemu/outputs/qemu-nonrt/.config "$ROOT/config/nonrt.config"
          # Real virtio-blk/ext4 guest read, not just a driver-load test.
          printf "EXP76_VIRTIO_BLOCK_IO_OK\\n" \
            > exp76-qemu/reports/virtio-block-fixture.txt
          truncate -s 32M exp76-qemu/virtio-ext4.img
          mkfs.ext4 -F -q -O ^metadata_csum,^64bit exp76-qemu/virtio-ext4.img
          debugfs -w -R "write exp76-qemu/reports/virtio-block-fixture.txt /fixture.txt" \
            exp76-qemu/virtio-ext4.img \
            > exp76-qemu/logs/virtio-block-image.log 2>&1
          debugfs -R "stat /fixture.txt" exp76-qemu/virtio-ext4.img \
            >> exp76-qemu/logs/virtio-block-image.log 2>&1
          sha256sum exp76-qemu/virtio-ext4.img \
            > exp76-qemu/reports/virtio-block-image.sha256
          sha256sum exp76-qemu/reports/virtio-block-fixture.txt \
            | awk '{print $1 "  /mnt/virtio/fixture.txt"}' \
            > "$ROOT/config/virtio-block-verify.sha256"
          cp "$ROOT/config/virtio-block-verify.sha256" \
            exp76-qemu/reports/virtio-block-verify.sha256
          sudo mknod "$ROOT/dev/console" c 5 1
          sudo mknod "$ROOT/dev/null" c 1 3
          cat > "$ROOT/init" <<'INIT'
          #!/bin/sh
          set -eu
          export PATH=/bin
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          mount -t devtmpfs devtmpfs /dev || :
          result=0
          if [ -b /dev/vda ] \
             && mount -t ext4 -o ro /dev/vda /mnt/virtio \
             && sha256sum -c /config/virtio-block-verify.sha256; then
            echo 'EXP76_VIRTIO_BLK_READ=PASS'
          else
            echo 'EXP76_VIRTIO_BLK_READ=FAIL'
            result=1
          fi
          if grep -q 'exp76_mode=nonrt' /proc/cmdline; then
            echo 'EXP76_QEMU_SCENARIO=NONRT_BEGIN'
            /bin/sh /probe/gate.sh execute nonrt /probe/nonrt.ko \
              /config/nonrt.config /tmp/nonrt || result=1
            [ "$result" -eq 0 ] && echo 'EXP76_QEMU_NONRT=PASS'
          else
            echo 'EXP76_QEMU_SCENARIO=RT_BEGIN'
            /bin/sh /probe/gate.sh execute normal /probe/rt.ko \
              /config/rt.config /tmp/normal || result=1
            /bin/sh /probe/gate.sh execute noop /probe/rt.ko \
              /config/rt.config /tmp/noop || result=1
            if [ -f /tmp/normal/probe.log ]; then
              sed '$d' /tmp/normal/probe.log > /tmp/truncated.log
              set +e
              /bin/sh /probe/gate.sh verify normal /config/rt.config                 /tmp/truncated.log
              truncated_rc=$?
              set -e
              if [ "$truncated_rc" -ne 2 ]; then
                echo "EXP76_QEMU_TRUNCATED_LOG=FAIL rc=$truncated_rc"
                result=1
              else
                echo 'EXP76_QEMU_TRUNCATED_LOG=PASS expected_exit=2'
              fi
            else
              result=1
            fi
            [ "$result" -eq 0 ] && echo 'EXP76_QEMU_RT=PASS'
          fi
          echo "EXP76_QEMU_GUEST_RESULT=$result"
          sync
          sleep 1
          poweroff -f
          INIT
          # BusyBox /bin/sh is the entrypoint; no bash dependency in guest.
          chmod 0755 "$ROOT/init" "$ROOT/probe/gate.sh"
          (
            cd "$ROOT"
            find . -print0 | cpio --null -ov --format=newc 2>/dev/null | gzip -9
          ) > exp76-qemu/initramfs.cpio.gz
          test -s exp76-qemu/initramfs.cpio.gz
          sha256sum exp76-qemu/initramfs.cpio.gz \
            > exp76-qemu/reports/sha256-initramfs.txt

      - name: QEMU Cortex-A72 ARM64 RT — normal, noop and truncated-log controls
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          set +e
          timeout -k 5s 120s qemu-system-aarch64 \
            -M virt -cpu cortex-a72 -smp 4 -m 512 \
            -nographic -no-reboot \
            -kernel exp76-qemu/outputs/qemu-rt/arch/arm64/boot/Image \
            -initrd exp76-qemu/initramfs.cpio.gz \
            -drive file=exp76-qemu/virtio-ext4.img,if=none,id=vdisk,format=raw,readonly=on \
            -device virtio-blk-device,drive=vdisk \
            -append 'console=ttyAMA0 panic=-1 exp76_mode=rt' \
            > exp76-qemu/logs/qemu-rt-console.txt 2>&1
          rc=$?
          set -e
          echo "$rc" > exp76-qemu/reports/qemu-rt-exit-code.txt
          cat exp76-qemu/logs/qemu-rt-console.txt
          [ "$rc" -eq 0 ] || { echo "BLOCKED_QEMU_RT rc=$rc"; exit 1; }
          grep -q '^EXP76_VIRTIO_BLK_READ=PASS' exp76-qemu/logs/qemu-rt-console.txt
          grep -q '^EXP76_QEMU_RT=PASS' exp76-qemu/logs/qemu-rt-console.txt
          grep -q 'EXPECTED_FAIL_SERIALIZATION=PASS' exp76-qemu/logs/qemu-rt-console.txt
          grep -q 'EXP76_QEMU_TRUNCATED_LOG=PASS expected_exit=2' exp76-qemu/logs/qemu-rt-console.txt
          grep -q '^EXP76_QEMU_GUEST_RESULT=0' exp76-qemu/logs/qemu-rt-console.txt

      - name: QEMU Cortex-A72 ARM64 nonRT — module must refuse to load
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          set +e
          timeout -k 5s 120s qemu-system-aarch64 \
            -M virt -cpu cortex-a72 -smp 4 -m 512 \
            -nographic -no-reboot \
            -kernel exp76-qemu/outputs/qemu-nonrt/arch/arm64/boot/Image \
            -initrd exp76-qemu/initramfs.cpio.gz \
            -drive file=exp76-qemu/virtio-ext4.img,if=none,id=vdisk,format=raw,readonly=on \
            -device virtio-blk-device,drive=vdisk \
            -append 'console=ttyAMA0 panic=-1 exp76_mode=nonrt' \
            > exp76-qemu/logs/qemu-nonrt-console.txt 2>&1
          rc=$?
          set -e
          echo "$rc" > exp76-qemu/reports/qemu-nonrt-exit-code.txt
          cat exp76-qemu/logs/qemu-nonrt-console.txt
          [ "$rc" -eq 0 ] || { echo "BLOCKED_QEMU_NONRT rc=$rc"; exit 1; }
          grep -q '^EXP76_VIRTIO_BLK_READ=PASS' exp76-qemu/logs/qemu-nonrt-console.txt
          grep -q '^EXP76_QEMU_NONRT=PASS' exp76-qemu/logs/qemu-nonrt-console.txt
          grep -q 'EXPECTED_BLOCKED_CONFIG=PASS' exp76-qemu/logs/qemu-nonrt-console.txt
          grep -q '^EXP76_QEMU_GUEST_RESULT=0' exp76-qemu/logs/qemu-nonrt-console.txt

      - name: Re-verify captured serial artifacts offline and record each result
        shell: bash
        run: |
          set -euo pipefail
          GATE="tests/exp76-rt-spin-sleep/run-in-guest.sh"
          RT_CFG="exp76-qemu/outputs/qemu-rt/.config"
          NONRT_CFG="exp76-qemu/outputs/qemu-nonrt/.config"
          RT_LOG="exp76-qemu/logs/qemu-rt-console.txt"
          NONRT_LOG="exp76-qemu/logs/qemu-nonrt-console.txt"
          bash "$GATE" verify normal "$RT_CFG" "$RT_LOG" \
            > exp76-qemu/reports/host-normal-verify.txt
          bash "$GATE" verify noop "$RT_CFG" "$RT_LOG" \
            > exp76-qemu/reports/host-noop-verify.txt
          bash "$GATE" verify nonrt "$NONRT_CFG" "$NONRT_LOG" \
            > exp76-qemu/reports/host-nonrt-verify.txt
          awk '/^EXP76_PROBE_LOG_BEGIN mode=normal$/ { copy=1 }
               copy { print }
               /^EXP76_PROBE_LOG_END mode=normal$/ { exit }' \
            "$RT_LOG" | sed '$d' > exp76-qemu/logs/truncated-dmesg.txt
          set +e
          bash "$GATE" verify normal "$RT_CFG" \
            exp76-qemu/logs/truncated-dmesg.txt \
            > exp76-qemu/reports/host-truncated-verify.txt 2>&1
          truncated_rc=$?
          set -e
          printf '%s\n' "$truncated_rc" > exp76-qemu/reports/truncated-verify-exit-code.txt
          test "$truncated_rc" -eq 2
          cp "$RT_LOG" exp76-qemu/logs/dmesg-rt.txt
          cp "$NONRT_LOG" exp76-qemu/logs/dmesg-nonrt.txt
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path("exp76-qemu")
          checks = [
              ("normal", "host-normal-verify.txt", "QEMU_RT_SPINLOCK=PASS"),
              ("noop", "host-noop-verify.txt", "EXPECTED_FAIL_SERIALIZATION=PASS"),
              ("nonrt", "host-nonrt-verify.txt", "EXPECTED_BLOCKED_CONFIG=PASS"),
          ]
          entries = []
          for name, path, needle in checks:
              raw = (root / "reports" / path).read_text()
              assert needle in raw, name
              entries.append({"scenario": name, "verifier_exit_code": 0,
                              "expected_output": needle, "observed": True})
          assert (root / "reports/truncated-verify-exit-code.txt").read_text().strip() == "2"
          entries.append({"scenario": "truncated-dmesg", "verifier_exit_code": 2,
                          "expected_output": "BLOCKED_ENV", "observed": True})
          manifest = {
              "test_id": "EXP76_RT_SPIN_SLEEP_QEMU_V3",
              "source_sha": os.environ["GITHUB_SHA"],
              "e404_base": os.environ["E404_BASE"],
              "toolchain_sha": os.environ["ANDROID_LLVM_COMMIT"],
              "qemu_rt_config_sha256": hashlib.sha256(
                  (root / "outputs/qemu-rt/.config").read_bytes()).hexdigest(),
              "qemu_nonrt_config_sha256": hashlib.sha256(
                  (root / "outputs/qemu-nonrt/.config").read_bytes()).hexdigest(),
              "pipa_rt_config_sha256": hashlib.sha256(
                  (root / "outputs/pipa-rt/.config").read_bytes()).hexdigest(),
              "scenarios": entries,
              "rt_handoff_ready": False, "flash_ready": False,
          }
          (root / "reports/qemu-scenario-results.json").write_text(
              json.dumps(manifest, indent=2) + "\n")
          print("EXP76_QEMU_FOUR_SCENARIOS=HOST_REVERIFIED")
          PY

      - name: Emit reproducibility hashes and qualified scope
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "source_branch_sha=$GITHUB_SHA"
            echo "e404_base=$E404_BASE"
            echo "clang21_commit=$ANDROID_LLVM_COMMIT"
            echo 'qemu_guest_test_id=EXP76_RT_SPIN_SLEEP_QEMU_V3'
            echo 'qemu_rt_functional=PASS'
            echo 'rt_handoff_ready=false'
            echo 'flash_ready=false'
          } > exp76-qemu/reports/qualification.txt
          cat exp76-qemu/reports/qualification.txt
          sha256sum exp76-qemu/logs/qemu-rt-console.txt \
            exp76-qemu/logs/qemu-nonrt-console.txt \
            > exp76-qemu/reports/sha256-console.txt
          echo 'EXP76_QEMU_RT_FUNCTIONAL=PASS; RT_HANDOFF_READY=false; NO_FLASH'

      - name: Upload actual QEMU test evidence, configs, hashes and modules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp76-qemu-rt-functional-NOFLASH
          path: |
            exp76-qemu/logs/
            exp76-qemu/reports/
            exp76-qemu/outputs/pipa-rt/.config
            exp76-qemu/outputs/qemu-rt/.config
            exp76-qemu/outputs/qemu-nonrt/.config
            exp76-qemu/outputs/pipa-rt/arch/arm64/boot/Image
            exp76-qemu/outputs/qemu-rt/arch/arm64/boot/Image
            exp76-qemu/outputs/qemu-nonrt/arch/arm64/boot/Image
            exp76-qemu/probe-qemu-rt/exp76_rt_spin_sleep.ko
            exp76-qemu/probe-qemu-nonrt/exp76_rt_spin_sleep.ko
            exp76-qemu/initramfs.cpio.gz
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  ccache-diagnostic:
    # Independent measurement job: failures never block the QEMU guest boot.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      E404_BASE: fed88a6024cd4d46c52eda607a95d97d7371ba81
      ANDROID_LLVM_COMMIT: b54cd2c8e9e0bb057aef3804d42d39c5ac4674c7
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CLANG_TRIPLE: aarch64-linux-gnu-
      LLVM_IAS: "1"
      HOSTCC: gcc
    steps:
      - uses: actions/checkout@v4

      - name: Preflight V3 guest gate and QEMU PIPA config-diff regressions
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/exp76-rt-spin-sleep/run-in-guest.sh
          bash tests/exp76-rt-spin-sleep/test-log-verifier.sh
          python3 -m py_compile tests/exp76-rt-spin-sleep/check-config-diff.py
          python3 -m py_compile tools/exp76-qemu-virtio-clang21.py
          python3 tools/exp76-qemu-virtio-clang21.py --self-test
          python3 -m py_compile tools/exp76-qemu-nonrt-rcu-qs.py
          python3 tools/exp76-qemu-nonrt-rcu-qs.py --self-test
          python3 tests/exp76-rt-spin-sleep/test-config-diff.py
          git diff --check
          echo 'EXP76_QEMU_STATIC_PREFLIGHT=PASS; QEMU_RUNTIME_NOT_YET_PROVEN'

      - name: Cache downloaded Ubuntu 24.04 apt archives (not dpkg state)
        uses: actions/cache@v4
        with:
          path: exp76-qemu/apt-archives
          key: exp76-apt-${{ runner.os }}-${{ runner.arch }}-ubuntu2404-arm64qemu-v1

      - name: Install pinned dependencies, BusyBox static and ARM64 QEMU
        shell: bash
        run: |
          set -euo pipefail
          # Keep the parent and evidence directories owned by runner.
          mkdir -p exp76-qemu/logs exp76-qemu/reports exp76-qemu/outputs
          mkdir -p exp76-qemu/apt-archives
          APT_ARCHIVES="$GITHUB_WORKSPACE/exp76-qemu/apt-archives"
          sudo mkdir -p "$APT_ARCHIVES/partial"
          sudo chown -R _apt:root "$APT_ARCHIVES"
          sudo chmod 755 "$APT_ARCHIVES"
          sudo chmod 700 "$APT_ARCHIVES/partial"
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Dir::Cache::archives="$APT_ARCHIVES" \
            -o APT::Keep-Downloaded-Packages=true \
            install -y --no-install-recommends \
            git make bc bison flex libssl-dev libelf-dev libncurses-dev python3 \
            gcc-aarch64-linux-gnu rsync device-tree-compiler \
            qemu-system-arm busybox-static cpio gzip xz-utils ccache e2fsprogs
          command -v qemu-system-aarch64
          command -v busybox
          command -v cpio
          mkdir -p exp76-qemu/logs exp76-qemu/reports exp76-qemu/outputs

      - name: Obtain exact EXP75 Android Clang 21
        shell: bash
        run: |
          set -euo pipefail
          mkdir android-clang-prebuilt
          cd android-clang-prebuilt
          git init
          git remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git config core.sparseCheckout true
          printf '/clang-r563880c/\n' > .git/info/sparse-checkout
          git config http.version HTTP/1.1
          for attempt in 1 2 3; do
            if git -c protocol.version=2 fetch --depth=1 --filter=blob:none \
              origin "$ANDROID_LLVM_COMMIT" && git checkout --detach FETCH_HEAD; then
              break
            fi
            test "$attempt" -lt 3
            sleep 15
          done
          test "$(git rev-parse HEAD)" = "$ANDROID_LLVM_COMMIT"
          test -x clang-r563880c/bin/clang
          test -x clang-r563880c/bin/ld.lld
          test -x clang-r563880c/bin/llvm-objcopy
          clang-r563880c/bin/clang --version | grep -F 'clang version 21.0.0'

      - name: Reconstruct pinned E404 plus official RT patch and EXP76 source ports
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          bash tools/exp76-rt-compat-audit.sh > exp76-qemu/logs/source-reconstruction.log 2>&1 || {
            tail -n 120 exp76-qemu/logs/source-reconstruction.log
            exit 1
          }
          test "$(git -C exp76-trial-overlay rev-parse HEAD)" = "$E404_BASE"
          # Restore the pinned KernelSU gitlink; drivers/kernelsu is a
          # symlink to ../KernelSU/kernel. Do not delete a required source.
          python3 tools/exp76-kconfig-source-audit.py \
            --tree exp76-trial-overlay --arch arm64 \
            --output exp76-qemu/reports/e404-kconfig-missing-sources.json
          git -C exp76-trial-overlay submodule update --init --recursive KernelSU \
            > exp76-qemu/logs/ksu-submodule-init.log 2>&1 || {
              cat exp76-qemu/logs/ksu-submodule-init.log
              echo 'BLOCKED_SUBMODULE_KERNELSU'; exit 2;
            }
          git -C exp76-trial-overlay submodule status \
            > exp76-qemu/reports/ksu-gitlink-status.txt
          test -f exp76-trial-overlay/drivers/kernelsu/Kconfig || {
            echo 'BLOCKED_KCONFIG_KERNELSU_UNRESOLVED'; exit 2;
          }
          python3 tools/exp76-kconfig-source-audit.py \
            --tree exp76-trial-overlay --arch arm64 \
            --output exp76-qemu/reports/e404-kconfig-after-submodule.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('exp76-qemu/reports/e404-kconfig-after-submodule.json').read_text())
          print('KCONFIG_MISSING_AFTER_SUBMODULE=', d['missing_source_paths_count'])
          assert 'drivers/kernelsu/Kconfig' not in d['missing_source_paths']
          PY
          python3 tools/exp76-stage82-rt-reject-inventory.py \
            --tree exp76-trial-overlay \
            --manifest exp76-rt-report/overlay/rejected-paths.txt \
            --report exp76-qemu/reports/stage82
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('exp76-qemu/reports/stage82/RT_REJECT_HUNK_INVENTORY.json').read_text())
          assert d['remaining_rejected_files']==64
          assert d['total_rejected_hunks']==209
          assert d['source_modified'] is False and d['rejects_deleted'] is False
          PY
          python3 tools/exp76-rt-stage83-arm64-neon-crypto.py \
            --tree exp76-trial-overlay \
            --index exp76-qemu/reports/stage82/RT_REJECT_HUNK_INVENTORY.json \
            --report exp76-qemu/reports/stage83 --mode apply
          python3 tools/exp76-stage88-rt-kconfig-guards.py \
            --tree exp76-trial-overlay \
            --index exp76-qemu/reports/stage82/RT_REJECT_HUNK_INVENTORY.json \
            --report exp76-qemu/reports/stage88 --mode apply
          python3 tools/exp76-stage89-proc-swait.py \
            --tree exp76-trial-overlay \
            --inventory exp76-qemu/reports/stage82/RT_REJECT_HUNK_INVENTORY.json \
            --report exp76-qemu/reports/stage89 --mode apply
          python3 tools/exp76-stage90-rt-uts-version.py \
            --tree exp76-trial-overlay \
            --index exp76-qemu/reports/stage82/RT_REJECT_HUNK_INVENTORY.json \
            --report exp76-qemu/reports/stage90 --mode apply
          python3 tools/exp76-stage91-pid-atomic-header.py \
            --tree exp76-trial-overlay \
            --index exp76-qemu/reports/stage82/RT_REJECT_HUNK_INVENTORY.json \
            --report exp76-qemu/reports/stage91 --mode apply
          python3 tools/exp76-rt-stage74-radix-locallock.py \
            --tree exp76-trial-overlay \
            --report exp76-qemu/reports/stage74 --mode apply
          python3 tools/exp76-rt-stage79-functionfs-swait.py \
            --tree exp76-trial-overlay \
            --report exp76-qemu/reports/stage79 --mode apply
          python3 tools/exp76-rt-stage85-rwsem-idr-link.py \
            --tree exp76-trial-overlay \
            --report exp76-qemu/reports/stage85 --mode apply
          # Fix the exact Clang21 VirtIO declaration in the disposable E404 tree.
          # Keep QEMU VirtIO enabled; the fix is included in source-diff.sha256.
          python3 tools/exp76-qemu-virtio-clang21.py \
            --tree exp76-trial-overlay \
            --report exp76-qemu/reports/virtio-clang21-compat.json \
            --mode apply
          # Retain RT RCU quiescent-state API; use E404 vendor API in nonRT.
          python3 tools/exp76-qemu-nonrt-rcu-qs.py \
            --tree exp76-trial-overlay \
            --report exp76-qemu/reports/nonrt-softirq-rcu-qs.json
          test "$(find exp76-trial-overlay -name '*.rej' -type f | wc -l)" -eq 64
          git -C exp76-trial-overlay diff --check
          git -C exp76-trial-overlay diff --binary | sha256sum \
            > exp76-qemu/reports/source-diff.sha256

      - name: Generate separate effective PIPA_RT, QEMU_RT and QEMU_NONRT configs
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/android-clang-prebuilt/clang-r563880c/bin:$PATH"
          K="$GITHUB_WORKSPACE/exp76-trial-overlay"
          BASE="$GITHUB_WORKSPACE/exp76-qemu/outputs"
          mkdir -p "$BASE/pipa-rt" "$BASE/qemu-rt" "$BASE/qemu-nonrt"
          make -C "$K" O="$BASE/pipa-rt" ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            vendor/pipa_defconfig > exp76-qemu/logs/pipa-defconfig.log 2>&1
          "$K/scripts/config" --file "$BASE/pipa-rt/.config" \
            -d LTO_CLANG -d LTO_CLANG_THIN -d LTO_CLANG_FULL \
            -e LTO_NONE -d PREEMPT -e PREEMPT_RT_FULL
          make -C "$K" O="$BASE/pipa-rt" ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig >> exp76-qemu/logs/pipa-defconfig.log 2>&1
          grep -qx 'CONFIG_PREEMPT_RT_FULL=y' "$BASE/pipa-rt/.config"
          cp "$BASE/pipa-rt/.config" "$BASE/qemu-rt/.config"
          "$K/scripts/config" --file "$BASE/qemu-rt/.config" \
            -e MODULES -e MODULE_UNLOAD -e ARM_AMBA \
            -e SERIAL_AMBA_PL011 -e SERIAL_AMBA_PL011_CONSOLE \
            -e DEVTMPFS -e DEVTMPFS_MOUNT \
            -e VIRTIO_MENU -e VIRTIO -e VIRTIO_MMIO -e VIRTIO_BLK \
            -e EXT4_FS \
            -e VIRTIO_CONSOLE -e BLK_DEV_INITRD -e BINFMT_ELF \
            -d MODULE_SIG_FORCE
          make -C "$K" O="$BASE/qemu-rt" ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig > exp76-qemu/logs/qemu-rt-olddefconfig.log 2>&1
          for key in CONFIG_PREEMPT_RT_FULL CONFIG_MODULES CONFIG_MODULE_UNLOAD \
                     CONFIG_SERIAL_AMBA_PL011 CONFIG_SERIAL_AMBA_PL011_CONSOLE \
                     CONFIG_DEVTMPFS CONFIG_VIRTIO_MMIO CONFIG_VIRTIO_BLK \
                     CONFIG_EXT4_FS CONFIG_BLK_DEV_INITRD; do
            grep -qx "$key=y" "$BASE/qemu-rt/.config" || {
              echo "BLOCKED_CONFIG: $key != y"; exit 3;
            }
          done
          python3 tests/exp76-rt-spin-sleep/check-config-diff.py \
            --pipa "$BASE/pipa-rt/.config" \
            --qemu "$BASE/qemu-rt/.config" \
            --critical tests/exp76-rt-spin-sleep/rt-critical-configs.txt \
            --report exp76-qemu/reports/QEMU_RT_PIPA_DIFF.json
          cp "$BASE/qemu-rt/.config" "$BASE/qemu-nonrt/.config"
          "$K/scripts/config" --file "$BASE/qemu-nonrt/.config" \
            -d PREEMPT_RT_FULL -e PREEMPT
          make -C "$K" O="$BASE/qemu-nonrt" ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig > exp76-qemu/logs/qemu-nonrt-olddefconfig.log 2>&1
          ! grep -qx 'CONFIG_PREEMPT_RT_FULL=y' "$BASE/qemu-nonrt/.config"
          grep -qx 'CONFIG_MODULES=y' "$BASE/qemu-nonrt/.config"
          grep -qx 'CONFIG_MODULE_UNLOAD=y' "$BASE/qemu-nonrt/.config"

      - name: Restore config/source/Clang-keyed ccache (BUILD only)
        uses: actions/cache@v4
        with:
          path: exp76-qemu/ccache
          key: exp76-ccache-v1-${{ runner.os }}-${{ env.ANDROID_LLVM_COMMIT }}-${{ hashFiles('exp76-qemu/outputs/qemu-rt/.config') }}-${{ hashFiles('exp76-qemu/reports/source-diff.sha256') }}

      - name: Force uncached Clang21 rebuild of mm/slub.o and audit macro definitions
        id: slub_uncached
        shell: bash
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/android-clang-prebuilt/clang-r563880c/bin:$PATH"
          K="$GITHUB_WORKSPACE/exp76-trial-overlay"
          OUT="$GITHUB_WORKSPACE/exp76-qemu/outputs/qemu-rt"
          mkdir -p exp76-qemu/reports exp76-qemu/logs
          grep '^# CONFIG_SLUB_DEBUG is not set' "$OUT/.config" \
            > exp76-qemu/reports/slub-config-guard.txt
          grep -rEn --include='*.c' --include='*.h' --exclude-dir=.git \
            '^[[:space:]]*#[[:space:]]*define[[:space:]]+uninitialized_var' "$K" \
            > exp76-qemu/reports/uninitialized_var-definitions.txt || true
          find "$OUT/include/generated" -name 'compiler*' -print \
            > exp76-qemu/reports/slub-generated-compiler-files.txt 2>/dev/null || true
          rm -f "$OUT/mm/slub.o" "$OUT/mm/.slub.o.cmd"
          set +e
          CCACHE_DISABLE=1 make -C "$K" O="$OUT" ARCH=arm64 \
            CC='ccache clang' LD=ld.lld HOSTCC=gcc OBJCOPY=llvm-objcopy \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            -j4 mm/slub.o > exp76-qemu/logs/slub-uncached-rebuild.log 2>&1
          rc=$?
          set -e
          echo "$rc" > exp76-qemu/reports/slub-uncached-exit-code.txt
          echo "EXP76_SLUB_CCACHE_DISABLE_REBUILD_EXIT=$rc"
          if [ "$rc" -eq 0 ]; then
            test -s "$OUT/mm/slub.o"
            sha256sum "$OUT/mm/slub.o" \
              > exp76-qemu/reports/slub-uncached-object-sha256.txt
            echo "EXP76_SLUB_UNCACHED_OBJECT=PASS"
          else
            grep -n -m30 -E 'error:|fatal error:|Error [0-9]+' \
              exp76-qemu/logs/slub-uncached-rebuild.log || true
            tail -n 40 exp76-qemu/logs/slub-uncached-rebuild.log
            exit "$rc"
          fi

      - name: Execute independent ccache three-image diagnostic (nonblocking)
        id: ccache_experiment
        shell: bash
        continue-on-error: true
        timeout-minutes: 110
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/android-clang-prebuilt/clang-r563880c/bin:$PATH"
          K="$GITHUB_WORKSPACE/exp76-trial-overlay"
          BASE="$GITHUB_WORKSPACE/exp76-qemu/outputs/qemu-rt"
          export CCACHE_DIR="$GITHUB_WORKSPACE/exp76-qemu/ccache"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_MAXSIZE=5G
          export CCACHE_TEMPDIR="$RUNNER_TEMP/exp76-ccache-temp"
          mkdir -p "$CCACHE_DIR" "$CCACHE_TEMPDIR"
          set +e
          bash tools/exp76-ccache-3images.sh "$K" "$BASE" \
            "$GITHUB_WORKSPACE/exp76-qemu/reports" \
            "$GITHUB_WORKSPACE/exp76-qemu/logs"
          rc=$?
          set -e
          printf '%s\n' "$rc" > exp76-qemu/reports/ccache-diagnostic-exit-code.txt
          echo "EXP76_CCACHE_DIAGNOSTIC_EXIT=$rc"
          exit "$rc"

      - name: Publish independent ccache results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp76-ccache-diagnostic-NOFLASH
          path: |
