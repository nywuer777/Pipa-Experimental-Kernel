name: RT 4.19 conflict audit (NO INTEGRATION)
on:
  push:
    branches: [rt-audit]
    paths:
      - '.github/workflows/rt-conflict-audit.yml'
      - 'rt-audit/run-trigger.txt'
  workflow_dispatch:
    inputs:
      expected_sha256:
        description: 'Verified SHA-256 of official .xz (64 hex characters)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validate and download RT archive
        shell: bash
        env:
          EXPECTED: ${{ inputs.expected_sha256 || 'c79d3efb5daccc5a3f58d502189eadc7dd31a962215ca0a16fa8c3eb98cd88ce' }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "Invalid expected SHA"; exit 1; }
          mkdir -p rt-report
          URL=https://cdn.kernel.org/pub/linux/kernel/projects/rt/4.19/patch-4.19.325-rt140.patch.xz
          echo "$URL" > rt-report/source-url.txt
          curl -fL --retry 3 "$URL" -o rt.patch.xz
          stat -c '%s' rt.patch.xz | tee rt-report/archive-size-bytes.txt
          sha256sum rt.patch.xz | tee rt-report/archive-sha256.txt
          echo "$EXPECTED  rt.patch.xz" | sha256sum -c -
          echo 'Archive SHA-256 matches user-provided artifact; independent publisher authentication not established.' > rt-report/hash-trust.txt
          xz -t rt.patch.xz
          xz -dc rt.patch.xz > rt.patch
          sha256sum rt.patch | tee rt-report/uncompressed-sha256.txt
      - name: Full-history E404 and EXP25A source-overlay audit
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$GITHUB_WORKSPACE/rt-report-v2" PATCH="$GITHUB_WORKSPACE/rt.patch" bash tools/rt-audit-v2.sh
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rt-audit-evidence
          path: |
            rt-report/
            rt-report-v2/
          if-no-files-found: warn
          retention-days: 90
