# YAML / GitHub Actions Ubuntu 24.04 / EXP76 RT feasibility audit / NO FLASH
name: EXP76 PREEMPT_RT compatibility audit (NO FLASH)

on:
  push:
    branches: [exp76-preempt-rt-uname]
    paths:
      - '.github/workflows/exp76-rt-compat-audit.yml'
      - 'tools/exp76-rt-compat-audit.sh'
      - 'tools/exp76-rt-conflict-report.py'
      - 'tools/exp76-rt-stage1-port.py'
      - 'tools/exp76-rt-stage2-port.py'
      - 'tools/exp76-rt-stage3-rtmutex.py'
      - 'tools/exp76-rt-stage4-spinlock.py'
      - 'tools/exp76-spinlock-type-abi-audit.py'
      - 'tools/exp76-rt-stage5-spinlock-types.py'
      - 'tools/exp76-rt-stage6-irq-work.py'
      - 'tools/exp76-rt-stage7-locking.py'
      - 'tools/exp76-rt-stage8-rcu-equivalence.py'
      - 'tools/exp76-rt-stage9-rcu-softirq-abi.py'
      - 'tools/exp76-rt-stage10-rcuwait.py'
      - 'tools/exp76-rt-stage11-rcuwait-lifecycle.py'
      - 'tools/exp76-rt-stage12-rcupdate.py'
      - 'tools/exp76-rt-stage13-unified-rcu.py'
      - 'tools/exp76-rt-stage14-wake-q.py'
      - 'tools/exp76-rt-stage15-sched-features.py'
      - 'tools/exp76-stage15-feature-cc-preflight.py'
      - 'tools/exp76-export-partial-source.py'
      - 'tools/exp76-uname-probe.ps1'
      - 'tools/exp76-fix-uname.py'
      - 'tests/test_exp76_uname.py'
      - 'docs/EXP76-PREEMPT-RT-UNAME.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exp76-rt-compat-audit
  cancel-in-progress: false

jobs:
  rt-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - name: Validate EXP76 source audit tooling
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/exp76-rt-compat-audit.sh
          python3 tests/test_exp76_uname.py
          python3 -m py_compile tools/exp76-rt-conflict-report.py
          python3 -m py_compile tools/exp76-rt-stage1-port.py
          python3 -m py_compile tools/exp76-rt-stage2-port.py
          python3 -m py_compile tools/exp76-rt-stage3-rtmutex.py
          python3 -m py_compile tools/exp76-rt-stage4-spinlock.py
          python3 -m py_compile tools/exp76-spinlock-type-abi-audit.py
          python3 -m py_compile tools/exp76-rt-stage5-spinlock-types.py
          python3 -m py_compile tools/exp76-rt-stage6-irq-work.py
          python3 -m py_compile tools/exp76-rt-stage7-locking.py
          python3 -m py_compile tools/exp76-rt-stage8-rcu-equivalence.py
          python3 -m py_compile tools/exp76-rt-stage9-rcu-softirq-abi.py
          python3 -m py_compile tools/exp76-rt-stage10-rcuwait.py
          python3 -m py_compile tools/exp76-rt-stage11-rcuwait-lifecycle.py
          python3 -m py_compile tools/exp76-rt-stage12-rcupdate.py
          python3 -m py_compile tools/exp76-rt-stage13-unified-rcu.py
          python3 -m py_compile tools/exp76-rt-stage14-wake-q.py
          python3 -m py_compile tools/exp76-rt-stage15-sched-features.py
          python3 -m py_compile tools/exp76-stage15-feature-cc-preflight.py
          python3 -m py_compile tools/exp76-export-partial-source.py
          test -s docs/EXP76-PREEMPT-RT-UNAME.md
          test -s tools/exp76-uname-probe.ps1
          echo 'EXP76_BASELINE_WORKFLOW=CHECKED; NO_RT_BUILD; FLASH_READY=false'

      - name: Verify official RT source and audit pinned E404 plus partial EXP overlays
        shell: bash
        run: |
          set -euo pipefail
          bash tools/exp76-rt-compat-audit.sh
          test -s exp76-rt-report/summary.txt
          cat exp76-rt-report/summary.txt

      - name: Publish text audit evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp76-rt-compat-AUDIT-ONLY-${{ github.run_number }}
          path: |
            exp76-rt-report/
          if-no-files-found: warn
          retention-days: 90
