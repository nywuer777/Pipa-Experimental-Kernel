plugins {
    id 'com.android.application'
}
android {
    namespace 'dev.pipa.framegen.lab'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'dev.pipa.framegen.lab'
        minSdk 29
        targetSdk 34
        versionCode 335
        versionName '29.45-one-shot-swapchain-readback'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra -Werror'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
